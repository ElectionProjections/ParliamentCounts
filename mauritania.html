<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mauritania Seat Projector</title>
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --text:#1b2027; --muted:#667080; --border:#dde1e7;
  --track:#cfd5dd; --lo:#e6e9ee; --land:#c7ccd4; --row:#eef0f3; --pos:#14803c; --neg:#c62828;
  --amber:#d99a06; --green:#1f9d55; --red:#d64545; --thumb:#ffffff; --thumbring:#5a6472;
  --tipbg:#ffffff; --shadow:0 6px 24px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101216; --card:#1b1f26; --text:#e8ebef; --muted:#98a2af; --border:#2f353f;
    --track:#7a8493; --lo:#2d333d; --land:#555e6b; --row:#252a33; --pos:#4cc47c; --neg:#ef6a6a;
    --amber:#f0b429; --green:#3ec97f; --red:#ef6a6a; --thumb:#f2f4f7; --thumbring:#cfd5dd;
    --tipbg:#242933; --shadow:0 6px 24px rgba(0,0,0,.55);
   color-scheme:dark}
}
:root[data-theme="dark"]{
    --bg:#101216; --card:#1b1f26; --text:#e8ebef; --muted:#98a2af; --border:#2f353f;
    --track:#7a8493; --lo:#2d333d; --land:#555e6b; --row:#252a33; --pos:#4cc47c; --neg:#ef6a6a;
    --amber:#f0b429; --green:#3ec97f; --red:#ef6a6a; --thumb:#f2f4f7; --thumbring:#cfd5dd;
    --tipbg:#242933; --shadow:0 6px 24px rgba(0,0,0,.55);
   color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{text-align:center;font-size:24px;margin:6px 0 10px;font-weight:700}
h2{text-align:center;font-size:17px;margin:0 0 10px;font-weight:650}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 0 12px}
.loc{display:flex;justify-content:center;align-items:center;gap:14px;height:90px;margin:0 0 10px}
.loc svg{display:block}
.flag{width:50px;height:auto;border:1px solid var(--border);border-radius:3px;display:block;overflow:hidden}
.facts{display:grid;grid-template-columns:1fr 1fr;padding:14px 8px}
.fact{text-align:center;padding:0 8px;min-width:0}
.fact + .fact{border-left:1px solid var(--border)}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-size:26px;font-weight:750;font-variant-numeric:tabular-nums;margin:2px 0}
.big small{font-size:13px;font-weight:500;color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.fhbar{height:6px;border-radius:99px;background:var(--lo);margin:6px auto 6px;max-width:150px;overflow:hidden}
.fhbar i{display:block;height:100%;border-radius:99px;background:var(--amber)}
details.sys{padding:0}
details.sys summary{list-style:none;cursor:pointer;text-align:center;font-weight:600;padding:12px;display:flex;justify-content:center;align-items:center;gap:8px;border-radius:12px}
details.sys summary::-webkit-details-marker{display:none}
details.sys summary:focus-visible{outline:2px solid var(--thumbring);outline-offset:-2px}
details.sys summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
details.sys[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--border)}
.tile{text-align:center;padding:12px 4px;min-width:0;overflow-wrap:anywhere}
.tile + .tile{border-left:1px solid var(--border)}
.tile .lbl{font-size:9.5px;margin-bottom:4px}
.tile .v{font-size:12px;font-weight:600;line-height:1.25}
.tile .d{margin-top:6px;font-size:10px;line-height:1.3;color:var(--muted)}
.tile .dl{display:none}
@media (min-width:600px){.tile .ds{display:none}.tile .dl{display:inline}.tile .d{font-size:12px}.tile{padding:16px 10px}.tile .lbl{font-size:11px}.tile .v{font-size:15px}}
/* inputs */
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:0 10px;align-items:center;padding:4px 2px;border-bottom:1px solid var(--row)}
.row:last-child{border-bottom:0}
.row .nm{font-size:12.5px;line-height:1.25;font-weight:550;min-width:0;overflow-wrap:anywhere}
.row .ctl{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:10px;align-items:center}
.num{width:100%;font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:2px 6px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text)}
.num[readonly]{border-style:dashed;background:transparent;color:var(--muted);cursor:not-allowed}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer;--c:#888;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to right,var(--c) 0 var(--p),var(--track) var(--p) 100%)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--track)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;margin-top:-5px;background:var(--thumb);border:2px solid var(--c);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--thumb);border:2px solid var(--c);cursor:pointer}
input[type=range]:active{cursor:grabbing}
input[type=range]:active::-webkit-slider-thumb{cursor:grabbing}
input[type=range]:focus-visible{outline:2px solid var(--thumbring);outline-offset:2px;border-radius:6px}
input[type=range].locked{cursor:not-allowed;pointer-events:none;--c:var(--muted)}
input[type=range].locked::-webkit-slider-runnable-track{background:repeating-linear-gradient(135deg,var(--track) 0 5px,transparent 5px 9px),linear-gradient(to right,var(--muted) 0 var(--p),transparent var(--p) 100%);opacity:.75}
input[type=range].locked::-webkit-slider-thumb{background:var(--lo);border-style:dashed;border-color:var(--muted)}
input[type=range].locked::-moz-range-track{background:repeating-linear-gradient(135deg,var(--track) 0 5px,transparent 5px 9px);opacity:.75}
input[type=range].locked::-moz-range-thumb{background:var(--lo);border-style:dashed;border-color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn:hover{background:var(--row)}
.btn.on{background:var(--text);color:var(--card);border-color:var(--text)}
.btn:focus-visible{outline:2px solid var(--thumbring);outline-offset:1px}
.center{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.resetrow{display:flex;justify-content:center;margin-top:10px}
/* results */
.hemi{max-width:650px;margin:0 auto}
.hemi svg{display:block;width:100%;height:auto}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;margin:16px 0 14px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.sq{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:auto}
table.res th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px 6px 3px;border-bottom:1px solid var(--border);white-space:normal;line-height:1.15;vertical-align:bottom}
table.res th:not(:first-child){width:1%}
table.res th:last-child{white-space:nowrap}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res td{padding:7px 3px;border-bottom:1px solid var(--row);text-align:right;font-size:13px}
table.res td:first-child{font-size:12.5px;line-height:1.25}
table.res td.ty{color:var(--muted)}
table.res td.seats{font-weight:800}
table.res td.chg{padding-left:4px}
table.res td.chg.pos{color:var(--pos)}
table.res td.chg.neg{color:var(--neg)}
table.res td.chg.zero{color:var(--muted)}
.nm2{display:flex;gap:7px;align-items:flex-start}
.nm2 .dot{margin-top:3px}
@media (min-width:600px){
  .row{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
}
#tablewrap{overflow-x:auto}
.pacr{display:none}
@media (max-width:430px){.full{display:none}.pacr{display:inline;overflow-wrap:normal}}
@media (max-width:640px){
  #c-res{padding-left:8px;padding-right:8px}
  table.res{table-layout:auto}
  table.res th{white-space:normal;line-height:1.15;vertical-align:bottom;font-size:8.5px;padding:6px 1px 5px;overflow-wrap:normal}
  table.res th:last-child{white-space:nowrap}
  table.res td{font-size:11.5px;padding:7px 1px}
  table.res td.chg{padding-left:3px}
  table.res td:first-child{font-size:10px;line-height:1.2;padding-right:3px;overflow-wrap:anywhere;min-width:0}
  .nm2{gap:3px}
  .nm2 .dot{width:7px;height:7px;margin-top:3px}
}
@media (max-width:400px){table.res td:first-child{font-size:9px}table.res td{font-size:11px}table.res th{font-size:8px}#c-res{padding-left:6px;padding-right:6px}}
@media (max-width:370px){#c-res{padding-left:2px!important;padding-right:2px!important}table.res td:first-child{padding-right:1px}table.res td.chg{padding-left:2px}table.res th:first-child{padding-left:2px}}
.more{display:flex;justify-content:center;margin-top:10px}
.more:empty{display:none}
table.res th:nth-child(2),table.res td:nth-child(2),table.res th:nth-child(3),table.res td:nth-child(3){padding-right:8px}
@media (max-width:480px){
  table.res th:first-child,table.res td:first-child{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--border)}
}
table.res th:nth-child(2),table.res th:nth-child(4){min-width:76px}
@media (max-width:640px){table.res th:nth-child(2),table.res th:nth-child(4){min-width:46px}}
/* coalition */
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.chip .dot{width:9px;height:9px}
.chip.on{background:var(--text);color:var(--card);border-color:var(--text)}
.bar{position:relative;height:16px;border-radius:99px;background:var(--lo);margin:0 6px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;right:0;border-radius:99px;overflow:hidden;display:flex}
.bar .fill i{display:block;height:100%;flex:none;width:0;transition:width .18s ease;box-shadow:inset -1px 0 0 var(--card)}
.bar .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--text);border-radius:2px}
.bar .mk b{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.tally{text-align:center;margin-top:22px;font-size:13px;font-variant-numeric:tabular-nums}
.tally .ok{color:var(--pos);font-weight:700}
/* map */
.mapwrap{position:relative;max-width:600px;margin:0 auto}
.mapwrap svg{display:block;width:95%;margin:0 auto;height:auto;-webkit-tap-highlight-color:transparent}
.mapwrap svg *{outline:none}
.area{stroke:var(--card);stroke-width:.7;stroke-linejoin:round;cursor:pointer;transition:filter .08s}
.area:hover,.area.sel,.dia:hover,.dia.sel{filter:brightness(.86)}
.dia{cursor:pointer;stroke:var(--card);stroke-width:1.2}
.diahead{fill:var(--muted);font-size:15px;font-weight:600;pointer-events:none;user-select:none}
.insetbox{fill:var(--card);stroke:var(--border);stroke-width:1}
.ring{fill:none;stroke:var(--muted);stroke-width:1}
.mapmodes{margin:14px 0 12px}
.mlegend{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;margin-top:12px;font-size:12px}
.mlegend span{display:inline-flex;align-items:center;gap:5px}
.scale{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;font-size:12px;font-variant-numeric:tabular-nums}
.scale i{display:block;width:180px;max-width:50%;height:10px;border-radius:99px}
.tip{position:absolute;z-index:5;width:196px;background:var(--tipbg);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:8px 9px;font-size:12px;display:none}
.tip .th{display:flex;justify-content:space-between;gap:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--border);margin-bottom:4px}
.tip .th span:last-child{font-weight:500;color:var(--muted);white-space:nowrap}
.tip .tr{display:grid;grid-template-columns:minmax(0,1fr) 38px var(--sqw,0px);gap:6px;align-items:center;padding:2px 0}
.tip.two{width:240px}
.tip.two .tr{grid-template-columns:minmax(0,1fr) 44px 44px var(--sqw,0px)}
.tip .tr.f .a b,.tip .tr.f .p{font-weight:700}
.tip .tr.f .p2{font-weight:400}
.tip .tr.f.win .p2{font-weight:700}
.tip .tr.hd{font-size:10px;color:var(--muted);padding:0 0 2px}
.tip .tr .a{display:flex;align-items:center;gap:5px;min-width:0}
.tip .tr .a b{font-weight:inherit;overflow-wrap:anywhere}
.tip .tr .p{font-variant-numeric:tabular-nums;text-align:right}
.tip .tr .s{display:flex;gap:2px;justify-content:flex-end;min-width:0}
.tip .tr.w{font-weight:800}
.src{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>Mauritania Seat Projection</h1>

<div class="loc" id="loc"></div>

<section class="card facts" id="facts"></section>

<details class="card sys" id="sys">
  <summary>How the electoral system works</summary>
  <div class="tiles" id="tiles"></div>
  <div class="tiles" id="tiles2"></div>
</details>

<section class="card" id="c-input"><h2>Input mixed list vote share</h2><div class="rows" id="rows"></div><div class="resetrow"><button class="btn" id="reset" type="button">Reset</button></div></section>

<section class="card" id="c-res"><h2>Projected results</h2><div class="hemi" id="hemi"></div><div class="legend" id="hlegend"></div><div id="tablewrap"></div><div class="more" id="tblmore"></div></section>

<section class="card" id="c-coal"><h2>Coalition builder</h2><div class="chips" id="chips"></div><div class="bar" id="bar"><div class="fill"></div><div class="mk" id="mk"><b></b></div></div><div class="tally" id="tally"></div></section>

<section class="card" id="c-map"><h2>Projected results map</h2>
  <div class="center mapmodes" id="modes"></div>
  <div class="mapwrap" id="mapwrap"><div id="mapsvg"></div><div class="tip" id="tip"></div></div>
  <div class="mlegend" id="mlegend"></div>
</section>

<p class="src" id="src"></p>
</main>

    vals[e] = v; compVal[e] = cv;
  }
  const standing = new Set();
  for (const e in dd.r1) comps(e).forEach(p => standing.add(p));
  CODES.forEach(p => { if (!standing.has(p)){ const v = adj(0, S[p], B[p]); if (v > 0){ vals[p] = v; compVal[p] = {[p]: v}; } } });
  let tot = 0; for (const e in vals) tot += vals[e];
  for (const e in vals) vals[e] = 100 * vals[e] / tot;
  const pshare = {};
  for (const e in compVal) for (const p in compVal[e]) pshare[p] = (pshare[p] || 0) + 100 * compVal[e][p] / tot;
  const n = dd.seats;
  let seats, runoff = false, round2 = null;
  if (n >= 3){
    seats = lr(vals, n);
  } else {
    const blankFrac = dd.blank / (baseTot + dd.blank);
    const ranked = Object.keys(vals).sort((a, b) => vals[b] - vals[a]);
    const top = ranked[0];
    if (vals[top] * (1 - blankFrac) > 50){
      seats = {}; seats[top] = n;
    } else {
      runoff = true;
      const a = ranked[0], b = ranked[1];
      const f = {}; f[a] = vals[a] / (vals[a] + vals[b]); f[b] = vals[b] / (vals[a] + vals[b]);
      const g = {}; g[a] = 0; g[b] = 0;
      const r2 = dd.r2;
      if (r2 && Object.keys(r2).length === 2 && r2[a] !== undefined && r2[b] !== undefined){
        // same two finalists as in 2023: use that area's own transfer gain
        const s2 = r2[a] + r2[b], s1 = dd.r1[a] + dd.r1[b];
        g[a] = r2[a] / s2 - dd.r1[a] / s1; g[b] = r2[b] / s2 - dd.r1[b] / s1;
      } else {
        // new matchup: national average gain of each finalist from the 2023 runoffs
        const NG = natGains(), d = ((NG[a] || 0) - (NG[b] || 0)) / 2;
        g[a] = d; g[b] = -d;
      }
      const ha = f[a] + g[a], hb = f[b] + g[b];
      const win = (ha > hb || (ha === hb && vals[a] >= vals[b])) ? a : b;
      round2 = {}; round2[a] = 100 * ha; round2[b] = 100 * hb;
      seats = {}; seats[win] = n;
    }
  }
  const credit = {};
  const partners = {};
  for (const e in seats){
    // joint list: seats go to the partners in turn (2023 order), skipping any partner whose projected vote is zero
    let ps = comps(e);
    if (compVal[e]){ const live = ps.filter(p => compVal[e][p] > 0); if (live.length) ps = live; }
    partners[e] = ps;
    for (let i = 0; i < seats[e]; i++){ const p = ps[i % ps.length]; credit[p] = (credit[p] || 0) + 1; }
  }
  return {vals, seats, credit, runoff, round2, partners, pshare};
}
function nationalResult(S){
  const out = {};
  for (const L in NAT){
    const info = NAT[L]; let tot = 0; CODES.forEach(p => tot += info.v[p]);
    const vals = {}; let t2 = 0;
    CODES.forEach(p => { vals[p] = adj(100 * info.v[p] / tot, S[p], B[p]); t2 += vals[p]; });
    CODES.forEach(p => vals[p] = 100 * vals[p] / t2);
    out[L] = lr(vals, info.seats);
  }

}
function project(S){
  const zero = () => { const o = {}; CODES.forEach(p => o[p] = 0); return o; };
  const R = {const: zero(), dias: zero(), mixed: zero(), women: zero(), youth: zero(), total: zero(), dist: {}};
  D.forEach(dd => {
    const r = districtResult(dd, S); R.dist[dd.id] = r;
    for (const p in r.credit) R[dd.kind === 'D' ? 'dias' : 'const'][p] += r.credit[p];
  });
  const nat = nationalResult(S);
  for (const L in nat) for (const p in nat[L]) R[L][p] += nat[L][p];
  CODES.forEach(p => R.total[p] = R.const[p] + R.dias[p] + R.mixed[p] + R.women[p] + R.youth[p]);
  return R;
}

function partyShare(r, p){ return r.pshare[p] || 0; }

/* ---------- hemicycle ---------- */
const HEMI_ORDER = ['TEW','ISL','HAT','SAW','HOP','AND','AJD','KAR','UDP','NW','HIW','PMM','PRD','UFP','VAD','PUD','SOJ','RFD','PSJ','RAV','APP','RIB','PCP','CAP','INS'];
const HEMI = (function(){
  const N = TOTAL_SEATS, rowsN = 8, rin = 0.40, rout = 1.0, step = (rout - rin) / (rowsN - 1);
  const radii = []; for (let i = 0; i < rowsN; i++) radii.push(rin + i * step);
  const sumr = radii.reduce((a, b) => a + b, 0);
  let counts = radii.map(r => Math.round(N * r / sumr));
  let diff = N - counts.reduce((a, b) => a + b, 0), i = rowsN - 1;
  while (diff !== 0){ counts[i] += diff > 0 ? 1 : -1; diff += diff > 0 ? -1 : 1; i = (i - 1 + rowsN) % rowsN; }
  const seats = [];
  radii.forEach((r, ri) => { const n = counts[ri]; for (let k = 0; k < n; k++){ const th = Math.PI * (1 - (n === 1 ? .5 : k / (n - 1))); seats.push({th, r, ri}); } });
  seats.sort((a, b) => (b.th - a.th) || (a.r - b.r));
  return {seats, step};
})();
function drawHemi(R){
  const Wd = 650, pad = 12, Rout = (Wd - 2 * pad) / 2, cx = Wd / 2, cy = Rout + pad + 6;
  const dotR = HEMI.step * Rout * 0.40;
  let idx = 0, html = '';
  HEMI_ORDER.forEach(p => {
    const n = R.total[p];
    for (let k = 0; k < n; k++){
      const s = HEMI.seats[idx++];
      const x = cx + Math.cos(s.th) * s.r * Rout, y = cy - Math.sin(s.th) * s.r * Rout;
      html += `<circle data-p="${p}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dotR.toFixed(1)}" fill="${P[p].color}"/>`;
    }
  });
  $('#hemi').innerHTML = `<svg viewBox="0 0 ${Wd} ${cy + 16}" role="img" aria-label="Hemicycle of projected seats">${html}</svg>`;
  $('#hlegend').innerHTML = HEMI_ORDER.filter(p => R.total[p] > 0).map(p => `<span><i class="dot" data-p="${p}" style="background:${P[p].color}"></i>${esc(P[p].acr)}</span>`).join('');
}

function constVoteShares(R){

  if (!CV_W){ CV_W = {}; let t = 0; D.forEach(dd => { CV_W[dd.id] = Object.values(dd.r1).reduce((a, b) => a + b, 0); t += CV_W[dd.id]; }); CV_W.__t = t; }

function openTip(id, ev){
  const R = window.__R; const tip = $('#tip');
  let title, seats, rows = [], single;
  if (id === 'dia'){
    title = 'Diaspora'; seats = 4; single = false;
    const credit = {}; DIA_IDS.forEach(d => { for (const p in R.dist[d].credit) credit[p] = (credit[p] || 0) + R.dist[d].credit[p]; });
    rows = CODES.map(p => ({k: p, label: P[p].acr, col: P[p].color, share: diaShare(R, p), sq: Array(credit[p] || 0).fill(p), n: credit[p] || 0}));
  } else {
    const dd = distById[id], r = R.dist[id];
    title = dd.name; seats = dd.seats; single = seats === 1;
    rows = Object.keys(r.vals).map(e => {
      const ps = comps(e), sq = [], pp = (r.partners && r.partners[e]) || ps;
      for (let i = 0; i < (r.seats[e] || 0); i++) sq.push(pp[i % pp.length]);
      return {k: e, label: entLabel(e), col: P[ps[0]].color, p0: ps[0], share: r.vals[e], r2: r.round2 ? r.round2[e] : undefined, sq, n: r.seats[e] || 0};
    });
  }
  const two = id !== 'dia' && !!R.dist[id].round2;
  rows = rows.filter(x => x.share > 2 || x.n > 0 || x.r2 !== undefined).sort((a, b) => b.share - a.share);
  tip.classList.toggle('two', two);
  const maxShare = rows.length ? rows[0].share : 0;
  tip.innerHTML = `<div class="th"><span>${esc(title)}</span><span>${seats} ${seats === 1 ? 'seat' : 'seats'}</span></div>` +
    (two ? `<div class="tr hd"><span></span><span class="p">Round 1</span><span class="p">Round 2</span><span class="s"></span></div>` : '') +
    rows.map(x => {
      const win = single && x.n > 0;
      const fin = two && x.r2 !== undefined;
      return `<div class="tr${win && !two ? ' w' : ''}${fin ? ' f' : ''}${fin && x.n > 0 ? ' win' : ''}"><span class="a"><i class="dot" data-p="${x.p0 || x.k}" style="background:${x.col}"></i><b>${esc(x.label)}</b></span><span class="p">${f1(x.share)}%</span>${two ? `<span class="p p2">${x.r2 === undefined ? '–' : f1(x.r2) + '%'}</span>` : ''}<span class="s">${seatSquares(x.sq)}</span></div>`;
    }).join('');
  tip.style.setProperty('--sqw', Math.max(1, ...rows.map(x => x.sq.length)) * 11 - 2 + 'px');
  tip.style.display = 'block';
  const wrap = $('#mapwrap').getBoundingClientRect();
  let x = ev.clientX - wrap.left + 10, y = ev.clientY - wrap.top + 10;
  const tw = tip.offsetWidth, tipH = tip.offsetHeight;
  if (x + tw > wrap.width - 4) x = Math.max(4, ev.clientX - wrap.left - tw - 10);
  if (y + tipH > wrap.height - 4) y = Math.max(4, ev.clientY - wrap.top - tipH - 10);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  document.querySelectorAll('#msvg .sel').forEach(e => e.classList.remove('sel'));
  document.querySelectorAll(`#msvg [data-id="${id}"]`).forEach(el => el.classList.add('sel'));
  state.sel = id;
}
function closeTip(){
  $('#tip').style.display = 'none'; state.sel = null;
  document.querySelectorAll('#msvg .sel').forEach(e => e.classList.remove('sel'));
}
document.addEventListener('click', ev => { if (!ev.target.closest('#msvg') && !ev.target.closest('#tip')) closeTip(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeTip(); });
