<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Norway Seat Projector</title><style>:root{--bg:#F3F4F6;--card:#fff;--bd:#E2E5E9;--fg:#1C2430;--mut:#6B7280;--trk:#D9DDE2;--sea:#E6EEF1;--land:#C5CCD1;--good:#2E7D4F;--bad:#B3382C;--soft:#F7F8FA;--accent:#4A6FA5;--ring:#1C2430;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14171C;--card:#1E232A;--bd:#343C47;--fg:#E8EAED;--mut:#9AA3AE;--trk:#6E7785;--sea:#27313C;--land:#58636F;--good:#5FBF84;--bad:#E8786B;--soft:#252B33;--accent:#7FA2D6;--ring:#E8EAED;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;overflow-x:hidden}
main{max-width:760px;margin:0 auto;padding:20px 12px 28px}
h1{font-family:Georgia,"Iowan Old Style",serif;font-weight:400;font-size:28px;line-height:1.15;text-align:center;margin:6px 0 14px}
h2{font-family:Georgia,"Iowan Old Style",serif;font-weight:400;font-size:21px;text-align:center;margin:0 0 12px}
h3{font-size:14px;font-weight:600;text-align:center;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin:0 0 12px;position:relative}
.mut{color:var(--mut)}.sm{font-size:12px}.good{color:var(--good);font-weight:600}.center{text-align:center}
.lab{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
button{font-family:inherit}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none;vertical-align:-1px;margin-right:8px}
.sw.s8{width:8px;height:8px;border-radius:2px;margin-right:0}
.sw.hatch{background:repeating-linear-gradient(135deg,var(--mut) 0 2px,transparent 2px 4px);border:1px solid var(--mut)}

/* top */
.locator{display:flex;align-items:center;justify-content:center;gap:16px;height:96px;margin:0 0 12px}
.world{height:auto;max-width:60%;display:block}.world .land{fill:var(--land)}
.flag{width:50px;display:block;line-height:0;border:1px solid var(--bd);border-radius:3px;overflow:hidden;flex:none}
.flag svg{width:100%;height:auto;display:block}
.facts{display:grid;grid-template-columns:1fr 1fr;padding:0}
.fcol{padding:14px 8px;text-align:center;font-variant-numeric:tabular-nums;min-width:0}
.fcol+.fcol{border-left:1px solid var(--bd)}
.big{font-size:26px;font-weight:700;line-height:1.2;margin:2px 0}.unit{font-size:13px;font-weight:400;color:var(--mut);margin-left:2px}
.fbar{height:5px;border-radius:3px;background:var(--trk);margin:4px auto 6px;width:70%;overflow:hidden}.fbar i{display:block;height:100%}
.sys{padding:0}
.sys summary{list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;padding:12px 14px;font-weight:600;border-radius:8px}
.sys summary::-webkit-details-marker{display:none}
.sys summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.chev{width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.sys[open] .chev{transform:rotate(225deg) translateY(-2px)}
.tiles{display:grid;border-top:1px solid var(--bd)}
.t5{grid-template-columns:repeat(5,minmax(0,1fr))}.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{padding:12px 4px;text-align:center;min-width:0}
.tile+.tile{border-left:1px solid var(--bd)}
.tile .lab{font-size:9px;letter-spacing:.04em;margin-bottom:4px;overflow-wrap:break-word}
.tv{font-size:11.5px;font-weight:600;line-height:1.3;overflow-wrap:break-word;hyphens:manual}
@media (min-width:600px){.tile{padding:14px 10px}.tile .lab{font-size:10.5px;letter-spacing:.06em}.tv{font-size:14px}}

/* inputs */
.rows{margin:0 0 12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 280px 76px;align-items:center;gap:6px 12px;padding:9px 4px;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:0}
.pname{min-width:0;display:flex;align-items:center;font-size:14px}.pname .sw{margin-right:8px}
.nbox{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.nbox input{width:58px;padding:3px 5px;border:1px solid var(--bd);border-radius:4px;background:var(--card);color:var(--fg);font:inherit;text-align:right;font-variant-numeric:tabular-nums}
.locked .nbox input{background:var(--soft);color:var(--mut);border-style:dashed}
.locked .pname{color:var(--mut)}
.locked .pslider{cursor:not-allowed;opacity:.8}
.pslider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;margin:0;cursor:pointer;background:linear-gradient(to right,var(--c) var(--p),var(--trk) var(--p));touch-action:pan-y}
.locked .pslider{background:repeating-linear-gradient(135deg,var(--trk) 0 3px,var(--bd) 3px 6px)}
.pslider::-webkit-slider-runnable-track{background:transparent;height:6px}
.pslider::-moz-range-track{background:transparent;height:6px}
.pslider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid var(--c);box-sizing:border-box;cursor:pointer}
.pslider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--c);box-sizing:border-box;cursor:pointer}
.pslider:active{cursor:pointer}
.locked .pslider::-webkit-slider-thumb,.locked .pslider::-moz-range-thumb{display:none}
.pslider:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
.btn{padding:6px 14px;font-size:13px;border:1px solid var(--bd);border-radius:5px;background:var(--soft);color:var(--fg);cursor:pointer}
@media (max-width:520px){.prow{grid-template-columns:minmax(0,1fr) 76px;row-gap:8px;padding:10px 4px}.prow .pname{grid-column:1 / -1}.prow .pslider{grid-column:1}.prow .nbox{grid-column:2}}

/* results */
.hemi{width:100%;max-width:600px;display:block;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:16px 0 8px;font-size:12px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.rt{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:12px;font-variant-numeric:tabular-nums}
.rt th{font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--mut);padding:8px 3px;border-bottom:2px solid var(--fg);text-align:right;vertical-align:bottom}
.rt td{padding:10px 3px;border-bottom:1px solid var(--bd);text-align:right;font-size:13.5px}
.rt .l{text-align:left}.rt td.l{line-height:1.25}
.rt th:nth-child(1){width:34%}.rt th:nth-child(2){width:15%}.rt th:nth-child(3){width:14%}.rt th:nth-child(4){width:15%}.rt th:nth-child(5){width:11%}.rt th:nth-child(6){width:11%}
@media (min-width:600px){.rt th{font-size:11px}.rt td{padding:10px 8px;font-size:14px}.rt th{padding:8px}}

/* chips */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 14px}
.chip{padding:4px 11px;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);font-size:12.5px;cursor:pointer;min-width:38px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.dark.on{background:var(--fg);border-color:var(--fg);color:var(--card)}
.chip.on[style*="F2A900"],.chip.on[style*="7DC242"],.chip.on[style*="B8A400"],.chip.on[style*="A5D6A7"],.chip.on[style*="D4A8F0"],.chip.on[style*="14B8E0"],.chip.on[style*="E58BB4"]{color:#1C2430}
.cbar{position:relative;margin:6px 0 20px}
.cfill{display:flex;height:12px;border-radius:5px;overflow:hidden;background:var(--trk)}
.maj{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);transform:translateX(-1px)}
.ctext{text-align:center;font-size:14px}

/* map */
.mapwrap{position:relative;border:1px solid var(--bd);border-radius:6px;background:var(--sea);padding:8px}
.map{width:100%;max-width:620px;max-height:690px;height:auto;display:block;margin:0 auto;user-select:none;touch-action:pan-x pan-y;outline:none}
.reg{cursor:pointer;stroke:var(--sea);stroke-width:.8;outline:none;transition:filter .12s}
.reg:hover,.reg.sel{filter:brightness(.84)}
.zoom{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.zoom button{width:30px;height:30px;border:1px solid var(--bd);border-radius:5px;background:var(--card);color:var(--fg);font-size:18px;line-height:1;padding:0;cursor:pointer}
.zoom button:disabled{opacity:.4;cursor:default}.zoom .wide{width:auto;padding:0 8px;font-size:12px}
.tip{position:absolute;transform:translate(-50%,12px);background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);padding:8px 10px;width:176px;z-index:5;font-size:12.5px}
.tt{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}.tt strong{font-size:13.5px;flex:1;min-width:0}.tt .mut{font-size:11.5px;white-space:nowrap}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0}
.tr{display:flex;align-items:center;gap:6px;margin:3px 0}.ta{flex:0 0 30px}.tp{flex:0 0 36px;text-align:right;color:var(--mut)}
.tdots{display:flex;flex-wrap:wrap;gap:2px;flex:1;min-width:0;padding-left:3px}.td{width:8px;height:8px;border-radius:50%;border:1.5px solid;display:inline-block}
.scale{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:12px;color:var(--mut)}.scale i{width:140px;height:10px;border-radius:3px;border:1px solid var(--bd)}
.mapwrap + .legend{margin-top:14px}

/* probability model */
.prog{position:absolute;left:0;right:0;top:0;height:3px;border-radius:8px 8px 0 0;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);transition:width .1s}
.mcrow{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.mcrow{grid-template-columns:1fr}}
.mcs{text-align:center}.mcl{font-size:12.5px;color:var(--mut);margin-bottom:12px;line-height:1.3}.mcv{margin-top:10px;font-weight:600;font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--bd);margin:24px 0}
.pmbody{transition:opacity .2s}.pmbody.dim{opacity:.45}
.pmbody>.sep:first-child{margin-top:24px}
.obar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--trk)}
.olegend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;margin-top:12px;font-size:12.5px}
.olegend span{display:flex;align-items:center;gap:6px}.osw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(150px,1.3fr);gap:0 22px;align-items:center}
.rh{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:0 0 8px;border-bottom:2px solid var(--fg)}
.rr{padding:13px 0;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}.rr:last-of-type{border-bottom:0}
.rgrid .r{text-align:right}.rp{display:flex;align-items:center;min-width:0}
.rc{display:block;min-width:150px}.rn{display:block;font-size:13px;margin-bottom:5px}
.rb{display:block;position:relative;height:6px;border-radius:3px;background:var(--trk)}.rb i{position:absolute;top:0;bottom:0;border-radius:3px}
.rb b{position:absolute;top:-3px;width:2px;height:12px;background:var(--fg);transform:translateX(-1px)}
.soft{background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:18px 14px;text-align:center;margin-top:18px}
.bigp{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.bigp span{font-size:22px;color:var(--mut);font-weight:600;margin-left:2px}
.plab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:8px 0 10px}
.pbar{height:6px;border-radius:3px;background:var(--trk);overflow:hidden;max-width:320px;margin:0 auto}.pbar i{display:block;height:100%;background:var(--good);border-radius:3px}
.stats{display:flex;justify-content:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd)}
.stats div{flex:1;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}.stats div+div{border-left:1px solid var(--bd)}
.stats strong{font-size:17px}.stats span{font-size:11.5px;color:var(--mut)}
.htip{height:38px;text-align:center;font-size:12.5px;line-height:19px;overflow:hidden}
.hist{width:100%;display:block;touch-action:pan-y}.hist .tk{font-size:10px;fill:var(--mut)}
.sources{margin:22px 0 0;padding-top:12px;border-top:1px solid var(--bd);font-size:11.5px;line-height:1.6;color:var(--mut)}

.chip{display:inline-flex;align-items:center;justify-content:center}
.cdot{width:9px;height:9px;border-radius:50%;margin-right:6px;flex:none}
.chip.on .cdot{box-shadow:0 0 0 1.5px #fff}
