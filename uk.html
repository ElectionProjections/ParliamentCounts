<title>UK Seat Projector</title>

<style>
:root{

}

  --track:#5A6378;--land:#4B5469;--held:#4F566A;--nocon:#5D6579;--mapbg:#11151E;
  --ok:#4ADE80;--bad:#F87171;--warn:#F5B942;--shadow:0 6px 18px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1219;--card:#161A24;--bd:#2A3040;--fg:#F1F2F5;--mut:#9AA1B3;--soft:#1F2431;
  --track:#5A6378;--land:#4B5469;--held:#4F566A;--nocon:#5D6579;--mapbg:#11151E;
  --ok:#4ADE80;--bad:#F87171;--warn:#F5B942;--shadow:0 6px 18px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1{font-size:24px;font-weight:700;text-align:center;margin:4px 0 0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;text-align:center;margin:0 0 12px}
.num,.fbig,.tv{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;min-width:0}
.locator{display:flex;justify-content:center;align-items:center;gap:16px;min-height:90px}
.locator svg{max-width:220px;height:auto;flex:0 1 auto}
.land{fill:var(--land)}
.flag{width:50px;height:auto;border:1px solid var(--bd);border-radius:3px;display:block;flex:none}
.facts{display:grid;grid-template-columns:1fr 1fr;padding:0}
.fact{padding:14px 10px;text-align:center;min-width:0}
.fact+.fact{border-left:1px solid var(--bd)}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.fbig{font-size:26px;font-weight:700;margin:4px 0 2px;line-height:1.15}
.fof{font-size:14px;font-weight:500;color:var(--mut);margin-left:2px}
.fsub{font-size:12px;color:var(--mut)}
.fbar{height:6px;border-radius:99px;background:var(--track);margin:4px auto 6px;max-width:160px;overflow:hidden}
.fbar div{height:100%;background:var(--ok);border-radius:99px}
details.sys{padding:0}
details.sys summary{list-style:none;cursor:pointer;text-align:center;font-weight:600;padding:13px 16px;border-radius:10px;display:flex;justify-content:center;align-items:center;gap:8px}
details.sys summary::-webkit-details-marker{display:none}
details.sys summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details.sys[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
details.sys summary:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--bd)}
.tile{padding:12px 4px;text-align:center;min-width:0}
.tile+.tile{border-left:1px solid var(--bd)}
.tl{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;margin-bottom:4px;overflow-wrap:anywhere}
.tv{font-size:11px;font-weight:600;overflow-wrap:break-word;hyphens:auto}
@media(min-width:600px){.tile{padding:16px 10px}.tl{font-size:11px}.tv{font-size:14px}}
.tabs{display:flex;gap:4px;justify-content:center;margin-bottom:14px;background:var(--soft);padding:3px;border-radius:8px}
.tab{flex:1;min-width:0;border:0;background:transparent;color:var(--mut);font:inherit;font-size:13px;font-weight:500;padding:6px 4px;border-radius:6px;cursor:pointer;position:relative}
.tab.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.18);font-weight:600}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
.swrow{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:16px}
.switch{position:relative;width:34px;height:20px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch-track{position:absolute;inset:0;background:var(--track);border-radius:99px;transition:background .15s;pointer-events:none}
.switch-track::before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--card);border-radius:50%;transition:transform .15s;box-shadow:0 0 0 1px var(--mut)}
.switch input:checked+.switch-track{background:var(--ok)}
.switch input:checked+.switch-track::before{transform:translateX(14px)}
.switch input:focus-visible+.switch-track{outline:2px solid var(--fg);outline-offset:2px}
.sliders{display:flex;flex-direction:column;gap:16px}
.srow{min-width:0}
.slabel{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;margin-bottom:6px;min-width:0}
.sname{min-width:0;overflow-wrap:anywhere}
.swatch{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.stag{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border:1px solid var(--bd);border-radius:4px;padding:0 5px;flex:none}
.sctl{display:flex;align-items:center;gap:12px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:6px;border-radius:99px;margin:6px 0;outline:none;cursor:pointer;
  background:linear-gradient(to right,var(--thumb) var(--pct),var(--track) var(--pct))}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--thumb);border:2px solid var(--card);box-shadow:0 0 0 1px var(--mut);margin-top:-6px;cursor:pointer}
input[type=range]:active::-webkit-slider-thumb{cursor:grabbing}
input[type=range]::-moz-range-track{height:6px;background:var(--track);border-radius:99px}
input[type=range]::-moz-range-progress{height:6px;background:var(--thumb);border-radius:99px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--thumb);border:2px solid var(--card);box-shadow:0 0 0 1px var(--mut);cursor:pointer}
input[type=range]:active::-moz-range-thumb{cursor:grabbing}
input[type=range]:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
.frozen input[type=range]{cursor:not-allowed;background:repeating-linear-gradient(135deg,var(--track) 0 5px,transparent 5px 10px),var(--soft);opacity:.7}
.frozen input[type=range]::-webkit-slider-thumb{visibility:hidden}
.frozen input[type=range]::-moz-range-thumb{visibility:hidden}
.frozen input[type=range]::-moz-range-progress{background:transparent}
.frozen .slabel{color:var(--mut)}
.numbox{display:flex;align-items:center;gap:2px;width:68px;flex:none;background:var(--soft);border:1px solid var(--bd);border-radius:6px;padding:4px 7px;cursor:text}
.numbox:focus-within{border-color:var(--fg)}
.numbox input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;padding:0}
.numbox span{color:var(--mut);font-size:13px}
.numbox.off{background:transparent;border-style:dashed;cursor:not-allowed}
.numbox.off input{cursor:not-allowed;color:var(--mut)}
.total{display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--bd);font-size:13px;color:var(--mut)}
.btnrow{display:flex;justify-content:center;gap:8px;margin-top:14px}
.btn{font:inherit;font-size:12.5px;font-weight:500;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:5px 12px;cursor:pointer}
.btn:hover{background:var(--soft)}
.hemiwrap{display:flex;justify-content:center}
.hemi{width:100%;max-width:650px;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:18px 0 16px;font-size:12.5px}
.lg{display:inline-flex;align-items:center;gap:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{white-space:nowrap;font-weight:600;font-size:12px;color:var(--mut);padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}
td{padding:9px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.pcell{display:flex;align-items:center;gap:8px;min-width:0}
td .pcell span:last-child{min-width:0}
.seats{font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--bad)}.zero{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:500;color:var(--fg);background:transparent;border:1.5px solid var(--bd);border-radius:99px;padding:4px 11px 4px 9px;cursor:pointer}
.chip:not(.on):hover{background:var(--soft)}
.chip.sm{font-size:12px;padding:3px 10px 3px 8px}
.chip.plain{padding:3px 11px}
.chip.plain.on{background:var(--fg);color:var(--card);border-color:var(--fg)}
.cbar{position:relative;padding:0 0 22px;margin:22px 4px 0}
.ctrack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--track)}
.ctrack div{height:100%}
.cmark{position:absolute;top:-6px;bottom:22px;width:2px;background:var(--fg);transform:translateX(-1px)}
.cmark span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.cfoot{display:flex;justify-content:center;gap:14px;font-size:13px;font-weight:600;margin-top:2px}
.ok{color:var(--ok)}
.map-wrap{position:relative;max-width:none;margin:0 auto;background:var(--mapbg);border-radius:8px;overflow:hidden}
.map-wrap svg{display:block;width:100%;height:auto;user-select:none;touch-action:none}
.seat{stroke:var(--card);cursor:pointer;outline:none}
.seat:hover,.seat.sel{filter:brightness(.82)}
.zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:26px;height:26px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:15px;line-height:1;cursor:pointer}
.tip{position:absolute;width:196px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow)}

.lv{flex:1;min-width:0;border:0;background:transparent;color:var(--mut);font:inherit;font-size:13px;line-height:1.2;font-weight:600;padding:8px 4px;border-radius:8px;cursor:pointer}
.lv.on{background:var(--fg);color:var(--card)}
.lv:not(.on):hover{color:var(--fg)}
.tip.wide{width:224px}
.tip-s{margin-left:auto;font-weight:500;color:var(--mut);font-size:12px;white-space:nowrap}
.tip-sn{min-width:20px;text-align:right}
.tip.wider{width:256px;max-width:calc(100% - 8px)}
.tip-r.reg{display:grid;grid-template-columns:10px minmax(0,1fr) auto 64px;align-items:start;column-gap:6px;padding:3px 0}
.tip-r.reg .swatch{margin-top:3px}
.tip-sq{display:flex;flex-wrap:wrap;gap:1px;align-content:flex-start;margin-top:4px;padding-left:4px}
.tip-sq i{width:5px;height:5px;border-radius:1px;display:block}
.mc-ctl{margin-bottom:14px}
.hint{font-size:12px;line-height:1.35;color:var(--mut);margin:-2px 0 6px}
.mc-prog{height:3px;border-radius:99px;background:var(--soft);overflow:hidden;margin:0 0 14px}
.mc-prog div{height:100%;background:var(--fg);transition:width .15s}
.mc-res{transition:opacity .15s}.mc-res.stale{opacity:.45}
.mc-bar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--track);margin:4px 0 0}
.mc-bar>div{height:100%}
.nomaj{background:repeating-linear-gradient(135deg,var(--track) 0 4px,var(--soft) 4px 8px)!important}
.mc-bar>.nomaj{margin-left:auto}
.mc-legend{margin:12px 0 16px}
.mc-pick{margin:18px 0 8px}
.mc-hist svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.mc-ax{font-size:10px;fill:var(--mut);font-variant-numeric:tabular-nums}
.tip-h{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;font-weight:600;font-size:13px;margin-bottom:5px}
.tip-h button{background:none;border:0;color:var(--mut);font-size:16px;line-height:1;cursor:pointer;padding:0}
.tip-r{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0}
.tip-r.win{font-weight:700}
.tip-n{flex:1;min-width:0}
.map-legend{margin:14px 0 0}
.cscale{width:100%;max-width:300px}
.cbarlg{height:10px;border-radius:99px;border:1px solid var(--bd)}
.cnums{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:3px}
.sources{margin:4px 0 0;font-size:11.5px;line-height:1.5;color:var(--mut);text-align:center}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>

        h("div", { className: "cnums num" }, h("span", null, fmt1((level === "seats" ? range : areaRange).lo), "%"), h("span", null, fmt1((level === "seats" ? range : areaRange).hi), "%")))));
}

// ---- Monte Carlo ----
function mulberry32(a) {

  for (const p in out) out[p] = out[p] / s * 100;

}

  for (const k of REGION_KEYS) {

    rs[k] = perturbShares(base, ctx.rel * 0.75, rng);

}

    stats[p] = { median: a[Math.floor(n / 2)], lo: a[Math.floor(n * 0.05)], hi: a[Math.min(n - 1, Math.floor(n * 0.95))], any: a.filter((v) => v > 0).length / n };

    largest[best] = (largest[best] || 0) + 1;

    h("div", { className: "slabel" }, h("span", { className: "sname" }, label)),
    hint && h("div", { className: "hint" }, hint),
    h("div", { className: "sctl" },
      h("input", { type: "range", min: 0, max, step, value, "aria-label": label, style: { "--thumb": "var(--fg)", "--pct": pct + "%" }, onChange: (e) => onChange(parseFloat(e.target.value)) }),

}

  const size = Math.max(1, Math.ceil((hi - lo + 1) / 40));
  const nb = Math.floor((hi - lo) / size) + 1;

  for (let i = 0; i < n; i++) bins[Math.floor((a[i] - lo) / size)]++;

    h("svg", { viewBox: `0 0 ${W} ${H + 18}`, role: "img", "aria-label": "Distribution of simulated seats" },
      bins.map((c, i) => h("rect", { key: i, x: i * bw + 0.5, y: H - c / mx * H, width: Math.max(0.5, bw - 1), height: c / mx * H, fill: color, rx: 1 })),
      mx326 !== null && h("line", { x1: mx326, x2: mx326, y1: 0, y2: H, stroke: "var(--fg)", strokeWidth: 1.2, strokeDasharray: "3 3" }),

    const outcomes = Object.keys(res.major).map((p) => ({ key: p, label: fullName(p) + " majority", color: partyMeta(p).color, pct: res.major[p] / res.n * 100 }))

      h("div", { className: "legend mc-legend" }, outcomes.map((o) => h("span", { key: o.key, className: "lg" }, h("span", { className: "swatch", style: { background: bg(o) } }), o.label, " ", h("b", { className: "num" }, fmt1(o.pct), "%")))),
      h("table", null,
        h("thead", null, h("tr", null, h("th", null, "Party"), h("th", { className: "r" }, "Median"), h("th", { className: "r" }, "90% range"), h("th", { className: "r" }, "Largest"))),
        h("tbody", null, rows.map((p) => h("tr", { key: p },
          h("td", null, h("span", { className: "pcell" }, h("span", { className: "swatch", style: { background: partyMeta(p).color } }), h("span", null, pLabel(p)))),
          h("td", { className: "r num seats" }, res.stats[p].median),
          h("td", { className: "r num" }, res.stats[p].lo, "–", res.stats[p].hi),
          h("td", { className: "r num" }, res.largest[p] ? fmt1(res.largest[p] / res.n * 100) + "%" : "–"))))),
      h("div", { className: "chips mc-pick" }, rows.map((p) => {
        const meta = partyMeta(p), on = p === sel;
        return h("button", { key: p, className: "chip sm" + (on ? " on" : ""), "aria-pressed": on, style: on ? { background: meta.color, borderColor: meta.color, color: meta.text } : { borderColor: meta.color }, onClick: () => setPick(p) },
          h("span", { className: "swatch", style: { background: on ? meta.text : meta.color } }), meta.short);

    h("h2", null, "Monte Carlo simulation"),
    h("div", { className: "chips" }, [500, 1000, 5000].map((k) => h("button", { key: k, className: "chip sm plain" + (nSims === k ? " on" : ""), "aria-pressed": nSims === k, onClick: () => setNSims(k) }, k.toLocaleString("en-GB")))),

}
