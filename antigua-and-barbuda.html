<title>Antigua and Barbuda Seat Projector</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 760px working column of separate cards, ordered by workflow. */
:root {
  --bg: #f3f4f6; --card: #ffffff; --fg: #1a2230; --muted: #667085; --line: #dde1e8; --line2: #c3c9d4;
  --track: #cdd3de; --track2: #e4e8ee; --land: #e3e6ec; --land2: #c5cbd6; --ok: #1e8a52; --bad: #c8372d; --warn: #d9962b;
  --focus: #2b59c3; --thumb: #ffffff; --thumbb: #38445a; --shadow: rgba(20,30,50,.18);
  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b2029; --fg: #e8ebf1; --muted: #9aa3b2; --line: #2e3544; --line2: #424b5d;
    --track: #6a7893; --track2: #3a4354; --land: #3b4354; --land2: #566078; --ok: #4cc58a; --bad: #ff7d6e; --warn: #f0b23e;
    --focus: #7fa4ff; --thumb: #f1f3f7; --thumbb: #12151b; --shadow: rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --card: #1b2029; --fg: #e8ebf1; --muted: #9aa3b2; --line: #2e3544; --line2: #424b5d;
  --track: #6a7893; --track2: #3a4354; --land: #3b4354; --land2: #566078; --ok: #4cc58a; --bad: #ff7d6e; --warn: #f0b23e;
  --focus: #7fa4ff; --thumb: #f1f3f7; --thumbb: #12151b; --shadow: rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font);
  padding-block: 18px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { text-align: center; font-size: 22px; font-weight: 700; margin: 2px 0 0; text-wrap: balance; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { text-align: center; font-size: 17px; font-weight: 600; margin: 0 0 10px; }
.lab { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
button, input { font-family: inherit; }
button { -webkit-tap-highlight-color: transparent; }

/* locator row */
.loc { display: flex; justify-content: center; align-items: center; gap: 16px; height: 96px; }
.loc svg { display: block; }
.flag { width: 50px; height: 37.5px; border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; flex: none; }
.flag svg { width: 100%; height: 100%; display: block; }

/* key facts */
.facts { display: grid; grid-template-columns: 1fr 1fr; padding: 14px 0; text-align: center; font-variant-numeric: tabular-nums; }
.facts > div { padding: 2px 10px; min-width: 0; }
.facts > div + div { border-left: 1px solid var(--line); }
.big { font-size: 28px; font-weight: 700; line-height: 1.15; margin-top: 2px; }
.big small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.facts .muted { font-size: 12px; }
.fhbar { height: 6px; border-radius: 3px; background: var(--track2); margin: 7px auto 7px; max-width: 150px; overflow: hidden; }
.fhbar i { display: block; height: 100%; border-radius: 3px; background: var(--ok); }

/* electoral system dropdown */
details.sys { padding: 0; }
details.sys summary {
  display: flex; align-items: center; justify-content: center; gap: 9px; padding: 13px 16px; cursor: pointer;
  list-style: none; font-weight: 600; font-size: 15px; border-radius: 10px;
}
details.sys summary::-webkit-details-marker { display: none; }
details.sys summary::after {
  content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s;
}
details.sys[open] summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
details.sys summary:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line); padding: 14px 0 16px; }
.tile .sub { font-size: 9px; line-height: 1.3; color: var(--muted); margin-top: 4px; }
.tile { text-align: center; padding: 2px 4px; min-width: 0; }
.tile + .tile { border-left: 1px solid var(--line); }
.tile .lab { font-size: 9px; letter-spacing: .05em; }
.tile .val { font-size: 12px; font-weight: 600; margin-top: 5px; line-height: 1.25; }
@media (min-width: 600px) {
  .tile { padding: 4px 12px; } .tile .lab { font-size: 10.5px; letter-spacing: .08em; } .tile .val { font-size: 14.5px; } .tile .sub { font-size: 11px; }
}

/* inputs */
.rows { display: flex; flex-direction: column; }
.row { padding: 11px 0 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; padding-top: 2px; }
.row .name { font-weight: 500; }
.ctl { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.num { width: 68px; text-align: right; padding: 5px 7px; border: 1px solid var(--line2); border-radius: 6px; background: var(--card); color: var(--fg); font-size: 14px; font-variant-numeric: tabular-nums; }
.num:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.pct { width: 14px; color: var(--muted); }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 24px; margin: 0; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(to right, var(--c) 0, var(--c) var(--p), var(--track) var(--p), var(--track) 100%); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: linear-gradient(to right, var(--c) 0, var(--c) var(--p), var(--track) var(--p), var(--track) 100%); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -6px; border-radius: 50%; background: var(--thumb); border: 2px solid var(--thumbb); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--thumb); border: 2px solid var(--thumbb); cursor: pointer; }
input[type=range]:active, input[type=range]:hover { cursor: pointer; }
input[type=range]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.row.locked .name { color: var(--muted); }
.row.locked input[type=range], .row.locked input[type=range]:hover { cursor: not-allowed; }
.row.locked input[type=range]::-webkit-slider-runnable-track { background: repeating-linear-gradient(135deg, var(--track2) 0 5px, var(--track) 5px 10px); border: 1px dashed var(--line2); height: 8px; }
.row.locked input[type=range]::-moz-range-track { background: repeating-linear-gradient(135deg, var(--track2) 0 5px, var(--track) 5px 10px); border: 1px dashed var(--line2); height: 8px; }
.row.locked input[type=range]::-webkit-slider-thumb { visibility: hidden; }
.row.locked input[type=range]::-moz-range-thumb { visibility: hidden; }
.row.locked .num { background: var(--track2); color: var(--muted); border-style: dashed; cursor: not-allowed; }
.btn { font-size: 13px; padding: 5px 14px; border-radius: 7px; border: 1px solid var(--line2); background: transparent; color: var(--fg); cursor: pointer; }
.btn:hover { background: var(--track2); }
.btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.center { display: flex; justify-content: center; }

/* results */
.hemi { display: block; width: min(100%, 520px); height: auto; margin: 0 auto; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 16px 0 14px; font-size: 13px; font-weight: 500; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line2); }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { text-align: left; padding-left: 2px; }
th:not(:first-child), td:not(:first-child) { text-align: right; white-space: nowrap; }
td.seats { font-weight: 700; }
.pn { display: flex; align-items: center; gap: 9px; }
.pos { color: var(--ok); } .neg { color: var(--bad); }

/* coalition builder */
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; font-size: 13px; font-weight: 600; border-radius: 999px; border: 1.5px solid var(--line2); background: transparent; color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 18%, var(--card)); }
.chip.sm { padding: 4px 11px; font-size: 12.5px; }
.prog { position: relative; height: 12px; border-radius: 6px; background: var(--track2); margin: 30px 8px 0; }
.prog .fill { position: absolute; inset: 0; display: flex; border-radius: 6px; overflow: hidden; }
.prog .fill i { display: block; height: 100%; }
.prog .mark { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--fg); border-radius: 1px; }
.prog .marklab { position: absolute; top: 100%; margin-top: 8px; transform: translateX(-50%); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.status { text-align: center; margin-top: 38px; font-weight: 600; font-variant-numeric: tabular-nums; }
.status .maj { color: var(--ok); margin-left: 8px; }

/* map */
.modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-bottom: 12px; }
.mapwrap { position: relative; display: flex; flex-direction: column; align-items: center; }
.mapbox { position: relative; width: 100%; }
.map { display: block; width: 100%; height: 760px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.zoomctl { position: absolute; top: 0; right: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; opacity: .5; transition: opacity .15s; }
.zoomctl:hover, .zoomctl:focus-within { opacity: 1; }
.zoomctl button { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; border: 0; background: transparent; color: var(--muted); font-size: 14px; line-height: 1; cursor: pointer; }
.zoomctl button:hover { background: var(--track2); color: var(--fg); }
.zoomctl button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.zoomctl .zr { font-size: 10px; font-weight: 500; }
.area { fill: var(--land); stroke: var(--card); stroke-width: .8; vector-effect: non-scaling-stroke; stroke-linejoin: round; fill-rule: evenodd; cursor: pointer; outline: none; }
.area:hover, .area.sel { filter: brightness(.88); }
.maplegend { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 14px; font-size: 13px; font-weight: 500; }
.grad { width: min(240px, 80%); height: 10px; border-radius: 5px; border: 1px solid var(--line); }
.gradn { display: flex; justify-content: space-between; width: min(240px, 80%); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.tip { position: absolute; z-index: 5; width: 176px; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px 9px; box-shadow: 0 6px 18px var(--shadow); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tip[hidden] { display: none; }
.tip .t { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.tip .t span:last-child { font-weight: 500; color: var(--muted); white-space: nowrap; }
.tip .r { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
.tip .r .v { margin-left: auto; }
.tip .r.w { font-weight: 700; }
.sources { font-size: 11px; line-height: 1.5; color: var(--muted); text-align: center; margin: 4px 2px 0; }
@media (max-width: 420px) { .card { padding: 12px 12px; } .big { font-size: 24px; } }
</style>

</div>

<script>
/* Seat projection engine: 17 single-member FPTP constituencies, universal national swing. */
(function (root) {
  'use strict';

  function create(D) {
    const parties = D.parties;
    const cons = D.cons;
    const byKey = {};
    parties.forEach(p => { byKey[p.k] = p; });

    // Baseline: valid votes per constituency and nationally
    const V = cons.reduce((s, c) => s + c.valid, 0);
    cons.forEach(c => { c.w = c.valid / V; });

    // Contest sets: 'all' parties contest every constituency; regional parties and
    // single-constituency independents contest only where listed.
    function contests(p, c) { return p.contest === 'all' || p.contest.indexOf(c.name) >= 0; }

    const base = {};        // national baseline share (%)
    const W = {};           // share of national baseline vote in the constituencies a party contests
    const s0 = {};          // baseline constituency shares (fraction), s0[k][i]
    parties.forEach(p => {
      let votes = 0, w = 0;
      s0[p.k] = cons.map(c => {
        votes += (c.votes[p.k] || 0);
        if (contests(p, c)) w += c.w;
        return (c.votes[p.k] || 0) / c.valid;
      });
      base[p.k] = votes / V * 100;
      W[p.k] = w;
    });

    const sliderKeys = parties.filter(p => p.slider).map(p => p.k);
    const minorKeys = parties.filter(p => !p.slider).map(p => p.k);
    const minorBase = minorKeys.reduce((s, k) => s + base[k], 0);

    // Baseline winners and seats
    function winnerOf(shares) {
      let best = null, bv = -1;
      for (const p of parties) {           // parties are listed in default-strength order: ties go to the stronger 2026 party
        const v = shares[p.k] || 0;
        if (v > bv + 1e-12) { bv = v; best = p.k; }
      }
      return bv > 0 ? best : null;
    }
    const baseWinners = cons.map((c, i) => {
      const sh = {}; parties.forEach(p => { sh[p.k] = s0[p.k][i]; });
      return winnerOf(sh);
    });
    const baseSeats = {};
    parties.forEach(p => { baseSeats[p.k] = 0; });
    baseWinners.forEach(w => { if (w) baseSeats[w]++; });

    // Constituency share of one party at a given national input (% of national vote)
    function partyShare(p, input, i) {
      const T = 0.2 * base[p.k];               // taper threshold
      const Wp = W[p.k];
      if (!contests(p, cons[i])) return 0;
      const sb = s0[p.k][i] * 100;
      if (base[p.k] <= 0) return 0;
      if (input >= T) return Math.max(0, sb + (input - base[p.k]) / Wp);
      const atT = Math.max(0, sb + (T - base[p.k]) / Wp);
      return atT * (input / T);
    }

    /* inputs: {key: national %} for slider parties. Returns the full projection. */
    function project(inputs) {
      const nat = {};
      let sum = 0;
      sliderKeys.forEach(k => { nat[k] = inputs[k]; sum += inputs[k]; });
      const other = Math.max(0, 100 - sum);
      minorKeys.forEach(k => { nat[k] = minorBase > 0 ? other * base[k] / minorBase : 0; });

      const out = [];
      const seats = {};
      parties.forEach(p => { seats[p.k] = 0; });
      cons.forEach((c, i) => {
        const raw = {};
        let tot = 0;
        parties.forEach(p => { raw[p.k] = partyShare(p, nat[p.k], i); tot += raw[p.k]; });
        const shares = {};
        parties.forEach(p => { shares[p.k] = tot > 0 ? raw[p.k] / tot * 100 : 0; });
        const winner = tot > 0 ? winnerOf(shares) : null;
        if (winner) seats[winner]++;
        out.push({ name: c.name, shares: shares, winner: winner, was: baseWinners[i], gain: !!winner && winner !== baseWinners[i] });
      });
      return { nat: nat, other: other, cons: out, seats: seats };
    }

    return { project: project, base: base, baseSeats: baseSeats, baseWinners: baseWinners, sliderKeys: sliderKeys, minorKeys: minorKeys, totalSeats: cons.length, majority: Math.floor(cons.length / 2) + 1, W: W, V: V };
  }

  const api = { create: create };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Engine = api;
})(typeof self !== 'undefined' ? self : this);

</script>

  function sv(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }

  /* ---------- static header blocks ---------- */
  var W = D.world;
  $('loc').innerHTML =
    '<svg viewBox="0 0 ' + W.w + ' ' + W.h + '" width="' + W.w + '" height="' + W.h + '" role="img" aria-label="World map with Antigua and Barbuda marked in red">' +
    '<path d="' + W.land + '" fill="var(--land2)"/>' +
    '<path d="' + W.country + '" fill="#D7261E" stroke="#D7261E" stroke-width=".8"/>' +
    '<circle cx="' + W.cx + '" cy="' + W.cy + '" r="5.2" fill="none" stroke="#D7261E" stroke-width="1.4"/></svg>' +
    '<div class="flag" role="img" aria-label="Flag of Antigua and Barbuda">' + D.flag + '</div>';

  var F = D.facts;
  $('facts').innerHTML =
    '<div><div class="lab">Population</div><div class="big">' + F.pop + '</div><div class="muted">' + F.popNote + '</div></div>' +
    '<div><div class="lab">Freedom House</div><div class="big">' + F.fh + '<small>/100</small></div>' +
    '<div class="fhbar"><i style="width:' + F.fh + '%"></i></div><div class="muted">' + F.fhNote + '</div></div>';

  $('tiles').innerHTML = D.tiles.map(function (t) {
    return '<div class="tile"><div class="lab">' + t[0] + '</div><div class="val">' + t[1] + '</div>' + (t[2] ? '<div class="sub">' + t[2] + '</div>' : '') + '</div>';
  }).join('');

  $('sources').textContent = 'Sources: ' + D.sources;

  /* ---------- state ---------- */
  var inputs = {};
  function resetInputs() { eng.sliderKeys.forEach(function (k) { inputs[k] = eng.base[k]; }); }
  resetInputs();
  var selected = {};        // coalition selection
  var mode = 'winner';      // 'winner' | 'gains' | party key
  var tipFor = null;
  var res = null;

  /* ---------- inputs ---------- */
  var ctrls = {};
  function buildRow(key, label, locked) {
    var row = el('div', { 'class': 'row' + (locked ? ' locked' : '') });
    row.appendChild(el('div', { 'class': 'name' }, label));
    var ctl = el('div', { 'class': 'ctl' });
    var rng = el('input', { type: 'range', min: '0', max: '100', step: '0.1', id: 'rng-' + key, 'aria-label': label + ' vote share' });
    var num = el('input', { type: 'text', inputmode: 'decimal', 'class': 'num', id: 'num-' + key, 'aria-label': label + ' vote share percent' });
    if (locked) { rng.disabled = true; num.readOnly = true; num.tabIndex = -1; }
    else rng.style.setProperty('--c', P[key].color);
    ctl.appendChild(rng); ctl.appendChild(num); ctl.appendChild(el('span', { 'class': 'pct' }, '%'));
    row.appendChild(ctl);
    ctrls[key] = { rng: rng, num: num };
    return row;
  }
  var rowsEl = $('rows');
  eng.sliderKeys.forEach(function (k) {
    rowsEl.appendChild(buildRow(k, P[k].name + ' (' + P[k].acr + ')', false));
    var c = ctrls[k];
    c.rng.addEventListener('input', function () { setInput(k, parseFloat(c.rng.value)); });
    function commit() {
      var v = parseFloat(String(c.num.value).replace(',', '.'));
      if (isFinite(v)) setInput(k, v); else paintInputs();
    }
    c.num.addEventListener('change', commit);
    c.num.addEventListener('blur', commit);
    c.num.addEventListener('keydown', function (e) { if (e.key === 'Enter') { commit(); c.num.blur(); } });
  });
  rowsEl.appendChild(buildRow('OTHER', 'Other', true));

  function setInput(k, v) {
    v = Math.round(v * 10) / 10;
    var others = 0; eng.sliderKeys.forEach(function (j) { if (j !== k) others += inputs[j]; });
    var max = Math.max(0, 100 - others);
    v = Math.max(0, Math.min(v, max));
    inputs[k] = v;
    paintInputs(); render();
  }
  function paint(key, v, color) {
    var c = ctrls[key];
    c.rng.value = String(Math.round(v * 10) / 10);
    c.rng.style.setProperty('--p', Math.max(0, Math.min(100, v)) + '%');
    c.num.value = f1(v);
  }
  function paintInputs() {
    var sum = 0;
    eng.sliderKeys.forEach(function (k) { paint(k, inputs[k]); sum += inputs[k]; });
    paint('OTHER', Math.max(0, 100 - sum));
  }
  $('reset').addEventListener('click', function () { resetInputs(); paintInputs(); render(); });

  /* ---------- results table + legend ---------- */
  function shown(r) {
    return D.parties.filter(function (p) { return r.nat[p.k] >= 1 || r.seats[p.k] > 0; });
  }
  function renderTable(r) {
    var list = shown(r).sort(function (a, b) { return (r.seats[b.k] - r.seats[a.k]) || (r.nat[b.k] - r.nat[a.k]); });
    $('tbody').innerHTML = list.map(function (p) {
      var d = r.seats[p.k] - eng.baseSeats[p.k];
      var cls = d > 0 ? 'pos' : d < 0 ? 'neg' : '';
      var txt = d > 0 ? '+' + d : d < 0 ? '−' + Math.abs(d) : '0';
      return '<tr><td><span class="pn"><i class="dot" style="background:' + p.color + '"></i><span>' + p.name + ' (' + p.acr + ')</span></span></td><td>' + f1(r.nat[p.k]) + '%</td><td class="seats">' + r.seats[p.k] + '</td><td class="' + cls + '">' + txt + '</td></tr>';
    }).join('');
    return list;
  }

  /* ---------- hemicycle ---------- */
  var HEMI_ORDER = ['BPM', 'UPP', 'IND', 'ABLP'];
  var seatPos = (function () {
    /* Classic parliament diagram: evenly spaced rows, seats per row in proportion to row length
       (largest remainder to reach the total), end seats resting on the baseline, and seats ordered
       by angle so each party fills a radial wedge. */
    var total = eng.totalSeats, radii = [0.67, 1], nRows = radii.length;
    var sumR = radii.reduce(function (a, b) { return a + b; }, 0);
    var ideal = radii.map(function (r) { return total * r / sumR; });
    var cnt = ideal.map(Math.floor), left = total - cnt.reduce(function (a, b) { return a + b; }, 0);
    ideal.map(function (v, i) { return [v - Math.floor(v), i]; }).sort(function (a, b) { return b[0] - a[0]; })
      .slice(0, left).forEach(function (x) { cnt[x[1]]++; });
    var R = 200, unit = R / radii[nRows - 1], sr = 28, pad = 5;
    var cx = R + sr + pad, cy = R + sr + pad, out = [];
    radii.forEach(function (rr, i) {
      var r = rr * unit, k = cnt[i], a0 = Math.asin(Math.min(1, sr / r));
      for (var j = 0; j < k; j++) {
        var a = k === 1 ? Math.PI / 2 : (Math.PI - a0) - (Math.PI - 2 * a0) * j / (k - 1);
        out.push({ a: a, r: r, x: cx + r * Math.cos(a), y: cy - r * Math.sin(a) });
      }
    });
    out.sort(function (p, q) { return (q.a - p.a) || (p.r - q.r); });
    return { seats: out, w: 2 * cx, h: cy + pad, sr: sr, rows: cnt };
  })();
  function renderHemi(r) {
    var svg = $('hemi');
    svg.setAttribute('viewBox', '0 0 ' + seatPos.w + ' ' + seatPos.h);
    svg.innerHTML = '';
    var idx = 0;
    HEMI_ORDER.forEach(function (k) {
      for (var n = 0; n < r.seats[k]; n++) {
        var s = seatPos.seats[idx++];
        if (!s) return;
        svg.appendChild(sv('circle', { cx: s.x.toFixed(1), cy: s.y.toFixed(1), r: seatPos.sr, fill: P[k].color }));
      }
    });
    for (; idx < seatPos.seats.length; idx++) {
      var s2 = seatPos.seats[idx];
      svg.appendChild(sv('circle', { cx: s2.x.toFixed(1), cy: s2.y.toFixed(1), r: seatPos.sr - 1, fill: 'none', stroke: 'var(--line2)', 'stroke-width': 2, 'stroke-dasharray': '4 3' }));
    }
  }
  function renderLegend(list) {
    $('hlegend').innerHTML = list.map(function (p) {
      return '<span><i class="dot" style="background:' + p.color + '"></i>' + p.acr + '</span>';
    }).join('');
  }

  /* ---------- coalition builder ---------- */
  function renderCoalition(r) {
    var list = D.parties.filter(function (p) { return r.seats[p.k] > 0; })
      .sort(function (a, b) { return (r.seats[b.k] - r.seats[a.k]) || (r.nat[b.k] - r.nat[a.k]); });
    Object.keys(selected).forEach(function (k) { if (!(r.seats[k] > 0)) delete selected[k]; });
    var chips = $('chips'); chips.innerHTML = '';
    list.forEach(function (p) {
      var b = el('button', { type: 'button', 'class': 'chip', 'aria-pressed': selected[p.k] ? 'true' : 'false' });
      b.style.setProperty('--pc', p.color);
      b.innerHTML = '<i class="dot" style="background:' + p.color + '"></i>' + p.acr;
      b.addEventListener('click', function () { if (selected[p.k]) delete selected[p.k]; else selected[p.k] = true; renderCoalition(res); });
      chips.appendChild(b);
    });
    var total = eng.totalSeats, maj = eng.majority, got = 0, segs = '';
    list.forEach(function (p) {
      if (selected[p.k]) { got += r.seats[p.k]; segs += '<i style="width:' + (r.seats[p.k] / total * 100) + '%;background:' + p.color + '"></i>'; }
    });
    var pos = (maj / total * 100);
    $('prog').innerHTML = '<div class="fill">' + segs + '</div><div class="mark" style="left:' + pos + '%"></div><div class="marklab" style="left:' + pos + '%">' + maj + '</div>';
    $('status').innerHTML = got + ' of ' + total + ' seats' + (got >= maj ? '<span class="maj">Majority</span>' : '');
  }

  /* ---------- map ---------- */
  var mapEl = $('map'), tip = $('tip'), wrap = $('mapwrap');
  var VB = D.viewBox;
  var areas = {};
  /* zoom and pan: wheel without Ctrl, drag, two-finger pinch, buttons */
  var MAXZ = 8, moved = false, ptrs = {};
  function fitBase() {
    var r = mapEl.getBoundingClientRect(), asp = r.width / Math.max(1, r.height);
    var w = VB[2], h = VB[3];
    if (w / h < asp) w = h * asp; else h = w / asp;
    return [VB[0] + VB[2] / 2 - w / 2, VB[1] + VB[3] / 2 - h / 2, w, h];
  }
  var base = fitBase(), vb = base.slice();
  mapEl.setAttribute('viewBox', vb.map(function (n) { return +n.toFixed(2); }).join(' '));
  window.addEventListener('resize', function () { base = fitBase(); setVB(base[0], base[1], base[2]); });
  function setVB(x, y, w) {
    w = Math.min(base[2], Math.max(base[2] / MAXZ, w));
    var h = w * base[3] / base[2];
    x = Math.min(base[0] + base[2] - w, Math.max(base[0], x));
    y = Math.min(base[1] + base[3] - h, Math.max(base[1], y));
    vb = [x, y, w, h];
    mapEl.setAttribute('viewBox', vb.map(function (n) { return +n.toFixed(2); }).join(' '));
    var zoomed = w < base[2] - 0.01;
    mapEl.style.touchAction = zoomed ? 'none' : 'pan-y';
    mapEl.style.cursor = zoomed ? 'grab' : '';
    closeTip();
  }
  function zoomAt(cx, cy, factor) {
    var r = mapEl.getBoundingClientRect();
    var px = (cx - r.left) / r.width, py = (cy - r.top) / r.height;
    var nw = Math.min(base[2], Math.max(base[2] / MAXZ, vb[2] / factor)), nh = nw * base[3] / base[2];
    setVB(vb[0] + px * vb[2] - px * nw, vb[1] + py * vb[3] - py * nh, nw);
  }
  function zoomCentre(f) { var r = mapEl.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); }
  mapEl.addEventListener('wheel', function (e) {
    var f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0018));
    var atBase = vb[2] >= base[2] - 0.01;
    if (f < 1 && atBase) return;           // fully zoomed out: let the page scroll
    e.preventDefault(); zoomAt(e.clientX, e.clientY, f);
  }, { passive: false });
  mapEl.addEventListener('pointerdown', function (e) {
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
    if (Object.keys(ptrs).length === 1) moved = false;
  });
  window.addEventListener('pointermove', function (e) {
    var p = ptrs[e.pointerId]; if (!p) return;
    var ids = Object.keys(ptrs);
    if (ids.length >= 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]], d0 = Math.hypot(a.x - b.x, a.y - b.y), m0x = (a.x + b.x) / 2, m0y = (a.y + b.y) / 2;
      p.x = e.clientX; p.y = e.clientY;
      var d1 = Math.hypot(a.x - b.x, a.y - b.y), m1x = (a.x + b.x) / 2, m1y = (a.y + b.y) / 2;
      var r = mapEl.getBoundingClientRect();
      if (d0 > 0) zoomAt(m1x, m1y, d1 / d0);
      setVB(vb[0] - (m1x - m0x) * vb[2] / r.width, vb[1] - (m1y - m0y) * vb[3] / r.height, vb[2]);
      moved = true; return;
    }
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 4) moved = true;
    if (moved && vb[2] < base[2] - 0.01) {
      var rr = mapEl.getBoundingClientRect();
      setVB(vb[0] - dx * vb[2] / rr.width, vb[1] - dy * vb[3] / rr.height, vb[2]);
    }
    p.x = e.clientX; p.y = e.clientY;
  });
  function endPtr(e) { delete ptrs[e.pointerId]; }
  window.addEventListener('pointerup', endPtr); window.addEventListener('pointercancel', endPtr);
  $('zin').addEventListener('click', function () { zoomCentre(1.6); });
  $('zout').addEventListener('click', function () { zoomCentre(1 / 1.6); });
  $('zreset').addEventListener('click', function () { setVB(base[0], base[1], base[2]); });
  D.paths.forEach(function (p) {
    var a = sv('path', { d: p.d, 'class': 'area', 'data-name': p.name });
    a.addEventListener('click', function (e) { e.stopPropagation(); if (moved) return; openTip(p.name, e); });
    mapEl.appendChild(a); areas[p.name] = a;
  });
  document.addEventListener('click', function (e) { if (!tip.contains(e.target)) closeTip(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeTip(); });
  function closeTip() { tip.hidden = true; if (tipFor && areas[tipFor]) areas[tipFor].classList.remove('sel'); tipFor = null; }
  function tipHTML(name) {
    var c = res.cons.filter(function (x) { return x.name === name; })[0];
    var rows = D.parties.filter(function (p) { return c.shares[p.k] >= 1 || c.winner === p.k; })
      .sort(function (a, b) { return c.shares[b.k] - c.shares[a.k]; })
      .map(function (p) {
        return '<div class="r' + (c.winner === p.k ? ' w' : '') + '"><i class="sq" style="background:' + p.color + '"></i><span>' + p.acr + '</span><span class="v">' + f1(c.shares[p.k]) + '%</span></div>';
      }).join('');
    return '<div class="t"><span>' + name + '</span></div>' + rows;
  }
  function openTip(name, e) {
    if (tipFor && areas[tipFor]) areas[tipFor].classList.remove('sel');
    tipFor = name; areas[name].classList.add('sel');
    tip.innerHTML = tipHTML(name); tip.hidden = false;
    var wr = wrap.getBoundingClientRect();
    var x = e.clientX - wr.left + 10, y = e.clientY - wr.top + 10;
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > wr.width - 4) x = e.clientX - wr.left - tw - 10;
    x = Math.max(4, Math.min(x, wr.width - tw - 4));
    if (y + th > wr.height - 4) y = Math.max(4, e.clientY - wr.top - th - 10);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }

  function renderModes(r) {
    var list = D.parties.filter(function (p) { return r.nat[p.k] >= 1 || r.seats[p.k] > 0; })
      .sort(function (a, b) { return (r.seats[b.k] - r.seats[a.k]) || (r.nat[b.k] - r.nat[a.k]); });
    var keys = ['winner', 'gains'].concat(list.map(function (p) { return p.k; }));
    if (keys.indexOf(mode) < 0) mode = 'winner';
    var box = $('modes'); box.innerHTML = '';
    keys.forEach(function (k) {
      var b = el('button', { type: 'button', 'class': 'chip sm', 'aria-pressed': mode === k ? 'true' : 'false' });
      var pc = P[k] ? P[k].color : 'var(--fg)';
      b.style.setProperty('--pc', pc);
      if (P[k]) b.innerHTML = '<i class="dot" style="background:' + P[k].color + '"></i>' + P[k].acr;
      else b.textContent = k === 'winner' ? 'Winner' : 'Gains';
      b.addEventListener('click', function () { mode = (mode === k && k !== 'winner') ? 'winner' : k; renderMap(res); });
      box.appendChild(b);
    });
  }
  function mix(color, pct) { return 'color-mix(in srgb, ' + color + ' ' + pct.toFixed(1) + '%, var(--land))'; }
  function renderMap(r) {
    renderModes(r);
    var legend = $('maplegend'); legend.innerHTML = '';
    if (mode === 'winner' || mode === 'gains') {
      var seen = {}, order = [];
      r.cons.forEach(function (c) {
        var show = c.winner && (mode === 'winner' || c.gain);
        areas[c.name].style.fill = show ? P[c.winner].color : '';
        if (show && !seen[c.winner]) { seen[c.winner] = 1; order.push(c.winner); }
      });
      order.sort(function (a, b) { return (r.seats[b] - r.seats[a]); });
      var row = el('div', { 'class': 'legend', style: 'margin:0' });
      row.innerHTML = order.length ? order.map(function (k) {
        return '<span><i class="sq" style="background:' + P[k].color + '"></i>' + P[k].acr + '</span>';
      }).join('') : '<span><i class="sq" style="background:var(--land)"></i>None</span>';
      legend.appendChild(row);
    } else {
      var vals = r.cons.map(function (c) { return c.shares[mode]; });
      var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
      r.cons.forEach(function (c) {
        var t = hi > lo ? (c.shares[mode] - lo) / (hi - lo) : 1;
        areas[c.name].style.fill = mix(P[mode].color, 10 + 90 * t);
      });
      var g = el('div', { 'class': 'grad' });
      g.style.background = 'linear-gradient(to right, ' + mix(P[mode].color, 10) + ', ' + P[mode].color + ')';
      var n = el('div', { 'class': 'gradn' }, '<span>' + f1(lo) + '%</span><span>' + f1(hi) + '%</span>');
      legend.appendChild(g); legend.appendChild(n);
    }
    if (tipFor) { tip.innerHTML = tipHTML(tipFor); }
  }

  /* ---------- render ---------- */
  function render() {
    res = eng.project(inputs);
    var list = renderTable(res);
    renderHemi(res);
    renderLegend(shown(res));
    renderCoalition(res);
    renderMap(res);
  }
  paintInputs();
  render();
})();
</script>
