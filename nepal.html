<title>Nepal Seat Projector</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one 760px column of separate cards in workflow order (inputs, results, coalition, map). */
:root{
  --bg:#f1f4f8; --card:#ffffff; --fg:#18212c; --muted:#5b6878; --line:#e0e6ee; --track:#cdd5df;
  --btn:#ffffff; --btn-line:#c3ccd8; --on-bg:#18212c; --on-fg:#ffffff;
  --pos:#1b8a4a; --neg:#cc3a3a; --tint-base:#ffffff; --tip-shadow:0 4px 16px rgba(20,30,45,.18);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --card:#1b222b; --fg:#e7ecf2; --muted:#9aa8b8; --line:#2d3743; --track:#5c6a7b;
  --btn:#232c37; --btn-line:#475565; --on-bg:#e7ecf2; --on-fg:#10151b;
  --pos:#4cc47b; --neg:#ff7b7b; --tint-base:#1b222b; --tip-shadow:0 4px 16px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --card:#1b222b; --fg:#e7ecf2; --muted:#9aa8b8; --line:#2d3743; --track:#5c6a7b;
  --btn:#232c37; --btn-line:#475565; --on-bg:#e7ecf2; --on-fg:#10151b;
  --pos:#4cc47b; --neg:#ff7b7b; --tint-base:#1b222b; --tip-shadow:0 4px 16px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4;
  padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{text-align:center;font-size:22px;font-weight:600;margin:0 0 4px;text-wrap:balance}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 16px;min-width:0}
h2{text-align:center;font-size:17px;font-weight:600;margin:0 0 10px}
button{font:inherit;color:var(--fg);cursor:pointer}
.btn{background:var(--btn);border:1px solid var(--btn-line);border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:500;line-height:1.3}
.btn.on{background:var(--on-bg);color:var(--on-fg);border-color:var(--on-bg)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.btn[data-e]{border-color:var(--pc);display:inline-flex;align-items:center;gap:6px}
.btn[data-e]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.btn[data-e].on{background:var(--pc);border-color:var(--pc);color:var(--pt)}
.btn[data-e].on::before{background:var(--pt)}
.btnrow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}

/* inputs */
.rows{display:flex;flex-direction:column}
.row{padding:11px 0 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lab{font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.ctl{display:flex;align-items:center;gap:10px}
.sl{position:relative;flex:1;min-width:0;height:22px;display:flex;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;cursor:pointer;--pct:0%;--col:#888}
input[type=range]:active{cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;cursor:pointer;
  background:linear-gradient(to right,var(--col) 0 var(--pct),var(--track) var(--pct) 100%)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--track);cursor:pointer}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--col)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-6px;background:#fff;border:2px solid var(--col);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--col);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer}
.static{width:100%;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.static i{display:block;height:100%;background:var(--col)}
.num{display:flex;align-items:center;gap:4px;flex:none}
.num input{width:62px;font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:4px 6px;border:1px solid var(--btn-line);border-radius:6px;background:var(--btn);color:var(--fg);-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num input[readonly]{background:transparent;border-color:transparent}
.num span{color:var(--muted)}
.reset{display:flex;justify-content:center;margin-top:10px}

/* results */
.hemi{width:100%;max-width:650px;margin:0 auto;display:block;height:auto}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:14px auto 16px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .dot{width:10px;height:10px;border-radius:3px}
.tw{width:100%}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;line-height:1.2;padding:4px 3px 6px;vertical-align:bottom}
th:first-child,td:first-child{text-align:left}
td{padding:7px 3px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{white-space:normal;min-width:0;line-height:1.25}
td:first-child .dot{margin-right:6px;position:relative;top:0}
td.b{font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.z{color:var(--muted)}

/* coalition */
.bar{position:relative;height:16px;background:var(--track);border-radius:8px;margin:18px 4px 0;overflow:visible}
.bar .fill{height:100%;border-radius:8px;display:flex;overflow:hidden;width:0;transition:width .15s}
.bar .fill i{display:block;height:100%}
.mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);transform:translateX(-1px)}
.mlab{position:absolute;top:24px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.cstat{text-align:center;margin-top:30px;font-size:13px;font-variant-numeric:tabular-nums}
.cstat b{font-weight:600}.ok{color:var(--pos);font-weight:600}

/* map */
.mapwrap{position:relative;max-width:none;margin:12px -14px 0}
.mapwrap>svg{display:block;width:100%;height:auto}
.mapwrap>svg path{stroke:var(--card);stroke-width:.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.mapwrap>svg path:hover,.mapwrap>svg path.sel{filter:brightness(.86)}
.mapwrap>svg:focus,.mapwrap>svg path:focus{outline:none}
.zoom{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:4px;z-index:4}
.zoom .btn{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
.zoom .btn:disabled{opacity:.4;cursor:default}
.mapwrap>svg{touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.tip{position:absolute;z-index:5;width:172px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--tip-shadow);padding:7px 9px;font-size:12px;display:none}
.tip .th{display:flex;justify-content:space-between;gap:8px;font-weight:600;padding-bottom:5px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.tip .tr{display:flex;align-items:center;gap:6px;padding:2px 0;font-variant-numeric:tabular-nums}
.tip .tr .a{flex:1;min-width:0}
.tip .tr.w{font-weight:600}
.mlegend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:14px auto 0;font-size:12.5px;align-items:center}
.mlegend span{display:inline-flex;align-items:center;gap:5px}
.mlegend .dot{border-radius:3px}
.cbar{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:12px}
.cbar i{display:block;width:180px;max-width:46vw;height:10px;border-radius:5px}
.mb{margin-top:14px}
.src{text-align:center;font-size:11.5px;color:var(--muted);margin-top:6px;text-wrap:balance}
.src a{color:inherit}
@media (max-width:480px){
  .card{padding:12px 10px 14px}
  .mapwrap{margin-left:-10px;margin-right:-10px}
  table{font-size:12px}
  th{font-size:9px;letter-spacing:-.2px}
  td{padding:6px 1px}
  th,td{padding-left:1px;padding-right:1px}
  th:last-child{white-space:nowrap}
  td:first-child .dot{margin-right:4px}
}
</style>
<main>
  <h1>Nepal Seat Projection</h1>
  <section class="card"><h2>Input list vote share</h2><div class="rows" id="inputs"></div><div class="reset"><button class="btn" id="reset" type="button">Reset</button></div></section>

/* ---------- Model (pure; no DOM) ---------- */
const ENTS = DATA.ents;
const EI = {}; ENTS.forEach((e, i) => { EI[e.k] = i; });
const NE = ENTS.length;
const SL = ['RSP', 'NC', 'UML', 'NCP', 'SSP', 'RPP'].map(k => EI[k]);   // slider parties (cleared 3% list threshold in 2026)
const IS_SLIDER = new Array(NE).fill(false); SL.forEach(i => { IS_SLIDER[i] = true; });
const TOTAL_SEATS = 275, N_LIST = 110, MAJORITY = 138, THRESHOLD = 3, FIRST_DIVISOR = 1.4, TAPER = 0.2;
const B = ENTS.map(e => e.pr / DATA.prTotal * 100);                      // baseline list share (%)
let BO = 0; ENTS.forEach((e, i) => { if (!IS_SLIDER[i] && e.pr > 0) BO += B[i]; });
const C = DATA.cons.map(c => {
  const idx = [], vote = []; let T = 0;
  for (const k in c.v) { idx.push(EI[k]); vote.push(c.v[k]); T += c.v[k]; }
  return { id: c.id, n: c.n, d: c.d, T, idx, vote, share: vote.map(v => v / T * 100) };
});
const TT = C.reduce((a, c) => a + c.T, 0);

/* list-vote input for every party: sliders as set, "Other" pool shared pro rata over non-slider list parties */
function listShares(inp) {
  const L = new Array(NE).fill(0);
  let s = 0; SL.forEach((e, j) => { L[e] = inp[j]; s += inp[j]; });
  const O = Math.max(0, 100 - s);
  for (let e = 0; e < NE; e++) if (!IS_SLIDER[e]) L[e] = ENTS[e].pr > 0 ? O * B[e] / BO : 0;
  return L;
}
/* universal national swing on a constituency share, with taper */
function swing(c, b, i) {
  if (i >= b) return c + (i - b);
  const t = TAPER * b;
  if (i >= t) return Math.max(0, c + i - b);
  return Math.max(0, c - (1 - TAPER) * b) * i / t;
}
/* Sainte-Laguë, first divisor 1.4, 3% threshold of total valid list votes, 110 seats */
function allocate(L) {
  const votes = L.map(l => l / 100 * DATA.prTotal), n = new Array(NE).fill(0), el = [];
  for (let e = 0; e < NE; e++) if (ENTS[e].pr > 0 && L[e] >= THRESHOLD - 1e-9) el.push(e);
  for (let s = 0; s < N_LIST && el.length; s++) {
    let best = -1, bq = -1;
    for (const e of el) {
      const q = votes[e] / (n[e] === 0 ? FIRST_DIVISOR : 2 * n[e] + 1);
      if (q > bq + 1e-9 || (Math.abs(q - bq) <= 1e-9 && votes[e] > votes[best])) { bq = q; best = e; }
    }
    n[best]++;
  }
  return n;
}
function project(inp) {
  const L = listShares(inp);
  const con = new Array(NE).fill(0), vw = new Array(NE).fill(0), res = [];
  for (const c of C) {
    let sum = 0;
    const x = c.idx.map((e, j) => { const v = swing(c.share[j], B[e], L[e]); sum += v; return v; });
    let bi = 0;
    for (let j = 1; j < x.length; j++) {
      if (x[j] > x[bi] + 1e-12 || (Math.abs(x[j] - x[bi]) <= 1e-12 && c.vote[j] > c.vote[bi])) bi = j;
    }
    const sh = x.map(v => sum > 0 ? v / sum * 100 : 0);
    sh.forEach((s, j) => { vw[c.idx[j]] += c.T * s / 100; });
    con[c.idx[bi]]++;
    res.push({ w: c.idx[bi], sh });
  }
  const list = allocate(L);
  const cv = vw.map(v => v / TT * 100);
  const total = con.map((v, e) => v + list[e]);
  return { L, con, list, total, cv, res };
}
const BASE_INP = SL.map(e => B[e]);

if (typeof module !== 'undefined') module.exports = { DATA, ENTS, EI, SL, B, C, project, BASE_INP, BASE, swing, allocate, listShares };

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = v => v.toFixed(1);
const MINUS = '−';
const col = e => COLORS[ENTS[e].k];
const ink = hex => { const c = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] > 0.3 ? '#18212c' : '#ffffff'; };
const pstyle = e => `--pc:${col(e)};--pt:${ink(col(e))}`;
const lab = e => `${ENTS[e].n} (${ENTS[e].a})`;

/* self-check: the model must reproduce the real 2026 result at baseline */
(function () {
  const exp = { RSP: [125, 57], NC: [18, 20], UML: [9, 16], NCP: [8, 9], SSP: [3, 4], RPP: [1, 4], IND: [1, 0] };
  for (const k in exp) { const i = EI[k]; if (BASE.con[i] !== exp[k][0] || BASE.list[i] !== exp[k][1]) console.error('Baseline mismatch', k, BASE.con[i], BASE.list[i]); }
})();

let inp = BASE_INP.slice(), P = BASE;
const sel = new Set();
let mapMode = null, openCon = -1;

/* ----- inputs ----- */
$('inputs').innerHTML = SL.map((e, j) => `
  <div class="row"><div class="lab"><span class="dot" style="background:${col(e)}"></span>${esc(lab(e))}</div>
  <div class="ctl"><div class="sl"><input type="range" id="s${j}" min="0" max="60" step="0.1" style="--col:${col(e)}" aria-label="${esc(ENTS[e].a)} list vote share"></div>
  <div class="num"><input type="number" id="n${j}" min="0" max="60" step="0.1" inputmode="decimal" aria-label="${esc(ENTS[e].a)} list vote share percent"><span>%</span></div></div></div>`).join('') + `
  <div class="row"><div class="lab"><span class="dot" style="background:var(--track)"></span>Other</div>
  <div class="ctl"><div class="sl"><div class="static" style="--col:var(--muted)"><i id="oFill"></i></div></div>
  <div class="num"><input type="text" id="oNum" readonly tabindex="-1" aria-label="Other vote share"><span>%</span></div></div></div>`;

function setParty(j, v) {
  v = Math.round(v * 10) / 10;
  let others = 0; inp.forEach((x, k) => { if (k !== j) others += x; });
  const mx = Math.min(60, 100 - others);
  inp[j] = Math.max(0, Math.min(mx, v));
}
function syncUI(skipBox) {
  let s = 0;
  inp.forEach((v, j) => {
    s += v;
    const sl = $('s' + j); sl.value = v; sl.style.setProperty('--pct', (v / 60 * 100) + '%');
    if (j !== skipBox) $('n' + j).value = f1(v);
  });
  const o = Math.max(0, 100 - s);
  $('oNum').value = f1(o); $('oFill').style.width = Math.min(100, o / 60 * 100) + '%';
}
SL.forEach((e, j) => {
  const sl = $('s' + j), nb = $('n' + j);
  sl.addEventListener('input', () => { setParty(j, parseFloat(sl.value)); syncUI(); update(); });
  nb.addEventListener('input', () => { const v = parseFloat(nb.value); if (isNaN(v)) return; setParty(j, v); syncUI(j); update(); });
  const fmt = () => { nb.value = f1(inp[j]); };
  nb.addEventListener('change', fmt); nb.addEventListener('blur', fmt);
  nb.addEventListener('keydown', ev => { if (ev.key === 'Enter') nb.blur(); });
});
$('reset').addEventListener('click', () => { inp = BASE_INP.slice(); syncUI(); update(); });

/* ----- results: hemicycle + table ----- */
const HEMI = (function (N) {
  const ri = 0.38; let best = null;
  for (let R = 4; R <= 14; R++) {
    const r = [...Array(R)].map((_, j) => ri + (1 - ri) * j / (R - 1));
    const sum = r.reduce((a, b) => a + b, 0);
    const n = r.map(x => Math.round(N * x / sum));
    let diff = N - n.reduce((a, b) => a + b, 0), j = R - 1;
    while (diff !== 0) { n[j] += diff > 0 ? 1 : -1; diff += diff > 0 ? -1 : 1; j = (j - 1 + R) % R; }
    const sRow = (1 - ri) / (R - 1);
    const sArc = Math.min(...r.map((x, k) => Math.PI * x / (n[k] - 1)));
    const score = Math.abs(Math.log(sArc / sRow));
    if (!best || score < best.score) best = { R, r, n, score, sp: Math.min(sRow, sArc) };
  }
  const seats = [];
  best.r.forEach((rad, j) => { const n = best.n[j]; for (let k = 0; k < n; k++) seats.push({ a: Math.PI * k / (n - 1), rad }); });
  seats.sort((p, q) => p.a - q.a || p.rad - q.rad);
  return { seats, sp: best.sp };
})(TOTAL_SEATS);
const HEMI_ORDER = ['CPNM', 'NCP', 'UML', 'NWPP', 'RJM', 'PLP', 'PSPN', 'JP', 'NC', 'RSP', 'UNP', 'SSP'];
const HEMI_TAIL = ['RPP', 'IND'];
function hemiSequence() {
  const have = [];
  for (let e = 0; e < NE; e++) if (P.total[e] > 0) have.push(e);
  const seq = [];
  HEMI_ORDER.forEach(k => { const e = EI[k]; if (have.includes(e)) seq.push(e); });
  have.filter(e => !HEMI_ORDER.includes(ENTS[e].k) && !HEMI_TAIL.includes(ENTS[e].k)).sort((a, b) => P.total[b] - P.total[a]).forEach(e => seq.push(e));
  HEMI_TAIL.forEach(k => { const e = EI[k]; if (have.includes(e)) seq.push(e); });
  return seq;
}
function renderResults() {
  const seq = hemiSequence(), CX = 325, CY = 318, RO = 300, dr = (HEMI.sp * RO * 0.44).toFixed(1);
  let si = 0, dots = '';
  seq.forEach(e => { for (let k = 0; k < P.total[e]; k++) { const s = HEMI.seats[si++]; if (!s) break; dots += `<circle cx="${(CX - RO * s.rad * Math.cos(s.a)).toFixed(1)}" cy="${(CY - RO * s.rad * Math.sin(s.a)).toFixed(1)}" r="${dr}" fill="${col(e)}"/>`; } });
  $('hemi').innerHTML = `<svg class="hemi" viewBox="0 0 650 330" role="img" aria-label="Projected seats">${dots}</svg>`;
  $('hlegend').innerHTML = seq.map(e => `<span><i class="dot" style="background:${col(e)}"></i>${esc(ENTS[e].a)}</span>`).join('');
  const vis = [];
  for (let e = 0; e < NE; e++) if (P.total[e] > 0 || P.L[e] >= 1 || P.cv[e] >= 1) vis.push(e);
  vis.sort((a, b) => P.total[b] - P.total[a] || P.L[b] - P.L[a] || P.cv[b] - P.cv[a]);
  $('tbl').innerHTML = `<thead><tr><th>Party</th><th>Constituency<br>vote</th><th>Constituency<br>seats</th><th>List<br>vote</th><th>List<br>seats</th><th>Total<br>seats</th><th>+/${MINUS}</th></tr></thead><tbody>` + vis.map(e => {
    const d = P.total[e] - BASE.total[e];
    const ch = d > 0 ? `<span class="pos">+${d}</span>` : d < 0 ? `<span class="neg">${MINUS}${-d}</span>` : `<span class="z">0</span>`;
    return `<tr><td><span class="dot" style="background:${col(e)}"></span>${esc(lab(e))}</td><td>${f1(P.cv[e])}%</td><td>${P.con[e]}</td><td>${ENTS[e].pr > 0 ? f1(P.L[e]) + '%' : '–'}</td><td>${P.list[e]}</td><td class="b">${P.total[e]}</td><td>${ch}</td></tr>`;
  }).join('') + '</tbody>';
}

/* ----- coalition builder ----- */
function seatedParties() {
  const a = []; for (let e = 0; e < NE; e++) if (P.total[e] > 0) a.push(e);
  return a.sort((x, y) => P.total[y] - P.total[x] || P.L[y] - P.L[x]);
}
function renderBuilder() {
  const ps = seatedParties();
  [...sel].forEach(e => { if (!ps.includes(e)) sel.delete(e); });
  $('cbtns').innerHTML = ps.map(e => `<button type="button" class="btn${sel.has(e) ? ' on' : ''}" data-e="${e}" style="${pstyle(e)}">${esc(ENTS[e].a)}</button>`).join('');
  let filled = 0;
  ps.forEach(e => { if (sel.has(e)) filled += P.total[e]; });
  const fill = ps.filter(e => sel.has(e)).map(e => `<i style="background:${col(e)};width:${P.total[e] / Math.max(filled, 1) * 100}%"></i>`).join('');
  $('cfill').style.width = (filled / TOTAL_SEATS * 100) + '%'; $('cfill').innerHTML = fill;
  const mp = MAJORITY / TOTAL_SEATS * 100;
  $('cmark').style.left = mp + '%'; $('cmlab').style.left = mp + '%'; $('cmlab').textContent = MAJORITY;
  $('cstat').innerHTML = `<b>${filled}</b> of ${TOTAL_SEATS} seats` + (filled >= MAJORITY ? ` · <span class="ok">Majority reached</span>` : '');
}
$('cbtns').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const e = +b.dataset.e; sel.has(e) ? sel.delete(e) : sel.add(e); renderBuilder();
});

/* ----- map ----- */
$('mapwrap').insertAdjacentHTML('afterbegin', `<svg viewBox="-50 -50 ${DATA.vb[0] + 100} ${DATA.vb[1] + 100}" role="img" aria-label="Constituency map" tabindex="-1">${C.map((c, i) => `<path data-i="${i}" d="${c.d}"></path>`).join('')}</svg>`);
const PATHS = [...$('mapwrap').querySelectorAll('svg path')];

/* ----- map zoom / pan ----- */
const MAP = $('mapwrap'), SVG = MAP.querySelector('svg'), VW = DATA.vb[0], VH = DATA.vb[1], PAD = 50, FW = VW + 2 * PAD, FH = VH + 2 * PAD, KMAX = 16;
MAP.insertAdjacentHTML('afterbegin', `<div class="zoom"><button type="button" class="btn" id="zin" aria-label="Zoom in">+</button><button type="button" class="btn" id="zout" aria-label="Zoom out">\u2212</button><button type="button" class="btn" id="zreset" aria-label="Reset zoom"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`);
let view = { x: 0, y: 0, k: 1 }, dragMoved = false;
function setView(x, y, k) {
  k = Math.max(1, Math.min(KMAX, k));
  const w = FW / k, h = FH / k;
  view = { x: Math.max(0, Math.min(FW - w, x)), y: Math.max(0, Math.min(FH - h, y)), k };
  SVG.setAttribute('viewBox', `${(view.x - PAD).toFixed(2)} ${(view.y - PAD).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`);
  SVG.style.touchAction = k > 1 ? 'none' : 'pan-x pan-y';
  SVG.style.cursor = k > 1 ? 'grab' : 'default';
  $('zin').disabled = k >= KMAX - 1e-9; $('zout').disabled = k <= 1 + 1e-9; $('zreset').disabled = k <= 1 + 1e-9;
  closeTip();
}
function zoomAt(cx, cy, factor) {      // cx, cy: client coordinates that stay fixed
  const r = SVG.getBoundingClientRect(); if (!r.width) return;
  const fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height;
  const k = Math.max(1, Math.min(KMAX, view.k * factor));
  const sx = view.x + fx * FW / view.k, sy = view.y + fy * FH / view.k;
  setView(sx - fx * FW / k, sy - fy * FH / k, k);
}
function zoomCentre(factor) { const r = SVG.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor); }
$('zin').addEventListener('click', ev => { ev.stopPropagation(); zoomCentre(1.4); });
$('zout').addEventListener('click', ev => { ev.stopPropagation(); zoomCentre(1 / 1.4); });
$('zreset').addEventListener('click', ev => { ev.stopPropagation(); setView(0, 0, 1); });
SVG.addEventListener('wheel', ev => {           // plain wheel or trackpad pinch zooms the map
  ev.preventDefault();
  let dy = ev.deltaY * (ev.deltaMode === 1 ? 16 : 1);
  dy = Math.max(-100, Math.min(100, dy));
  zoomAt(ev.clientX, ev.clientY, Math.exp(-dy * (ev.ctrlKey ? 0.006 : 0.0012)));
}, { passive: false });
const ptrs = new Map(); let pinch = 0, down = null;
SVG.addEventListener('pointerdown', ev => {
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  down = { x: ev.clientX, y: ev.clientY, moved: false };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
});
window.addEventListener('pointermove', ev => {
  const p = ptrs.get(ev.pointerId); if (!p) return;
  const r = SVG.getBoundingClientRect(), dx = ev.clientX - p.x, dy = ev.clientY - p.y;
  p.x = ev.clientX; p.y = ev.clientY;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch > 0 && d > 0) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinch);
    pinch = d; dragMoved = true; return;
  }
  if (!down || view.k <= 1) { if (down && Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 6) dragMoved = true; return; }
  if (!down.moved && Math.hypot(ev.clientX - down.x, ev.clientY - down.y) <= 6) return;
  down.moved = true; dragMoved = true; SVG.style.cursor = 'grabbing';
  setView(view.x - dx * FW / view.k / r.width, view.y - dy * FH / view.k / r.height, view.k);
});
const endPtr = ev => { ptrs.delete(ev.pointerId); if (ptrs.size < 2) pinch = 0; if (!ptrs.size) { down = null; SVG.style.cursor = view.k > 1 ? 'grab' : 'default'; setTimeout(() => { dragMoved = false; }, 0); } };
window.addEventListener('pointerup', endPtr); window.addEventListener('pointercancel', endPtr);
setView(0, 0, 1);
function renderMap() {
  const ps = seatedParties();
  if (mapMode !== null && mapMode !== 'gains' && !ps.includes(mapMode)) mapMode = null;
  $('mbtns').innerHTML = `<button type="button" class="btn${mapMode === null ? ' on' : ''}" data-w="1">Winning party</button>` + `<button type="button" class="btn${mapMode === 'gains' ? ' on' : ''}" data-g="1">Gains</button>` + ps.map(e => `<button type="button" class="btn${mapMode === e ? ' on' : ''}" data-e="${e}" style="${pstyle(e)}">${esc(ENTS[e].a)}</button>`).join('');
  if (mapMode === 'gains') {
    const gain = new Array(NE).fill(0);
    PATHS.forEach((p, i) => {
      const w = P.res[i].w;
      if (w !== BASE.res[i].w) { gain[w]++; p.style.fill = col(w); }
      else p.style.fill = 'color-mix(in srgb, var(--muted) 16%, var(--tint-base))';
    });
    $('mleg').innerHTML = ps.filter(e => gain[e] > 0).sort((x, y) => gain[y] - gain[x]).map(e => `<span><i class="dot" style="background:${col(e)}"></i>${esc(ENTS[e].a)}</span>`).join('');
  } else if (mapMode === null) {
    PATHS.forEach((p, i) => { p.style.fill = col(P.res[i].w); });
    $('mleg').innerHTML = ps.filter(e => P.con[e] > 0).map(e => `<span><i class="dot" style="background:${col(e)}"></i>${esc(ENTS[e].a)}</span>`).join('');
  } else {
    const e = mapMode, vals = C.map((c, i) => { const j = c.idx.indexOf(e); return j < 0 ? 0 : P.res[i].sh[j]; });
    const mn = Math.min(...vals), mx = Math.max(...vals), cc = col(e);
    const mix = pct => `color-mix(in srgb, ${cc} ${pct}%, var(--tint-base))`;
    PATHS.forEach((p, i) => { const t = mx > mn ? (vals[i] - mn) / (mx - mn) : 1; p.style.fill = mix(8 + 92 * t); });
    $('mleg').innerHTML = `<div class="cbar"><span>${f1(mn)}%</span><i style="background:linear-gradient(to right,${mix(8)},${mix(100)})"></i><span>${f1(mx)}%</span></div>`;
  }
}
$('mbtns').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.w) { mapMode = null; renderMap(); return; }
  if (b.dataset.g) { mapMode = mapMode === 'gains' ? null : 'gains'; renderMap(); return; }
  const e = +b.dataset.e; mapMode = mapMode === e ? null : e; renderMap();
});
function tipHTML(i) {
  const c = C[i], r = P.res[i];
  const rows = c.idx.map((e, j) => ({ e, s: r.sh[j], win: e === r.w })).filter(x => x.s >= 1 || x.win).sort((a, b) => b.s - a.s);
  return `<div class="th"><span>${esc(c.n)}</span></div>` + rows.map(x =>
    `<div class="tr${x.win ? ' w' : ''}"><span class="dot" style="background:${col(x.e)}"></span><span class="a">${esc(ENTS[x.e].a)}</span><span>${f1(x.s)}%</span></div>`).join('');
}
function closeTip() { openCon = -1; $('tip').style.display = 'none'; PATHS.forEach(p => p.classList.remove('sel')); }
function refreshTip() { if (openCon >= 0) $('tip').innerHTML = tipHTML(openCon); }
$('mapwrap').addEventListener('click', ev => {
  if (dragMoved) return;
  const p = ev.target.closest('path');
  if (!p) { closeTip(); return; }
  const i = +p.dataset.i, tip = $('tip'), wr = $('mapwrap').getBoundingClientRect();
  PATHS.forEach(q => q.classList.remove('sel')); p.classList.add('sel');
  openCon = i; tip.innerHTML = tipHTML(i); tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = ev.clientX - wr.left + 10, y = ev.clientY - wr.top + 10;
  if (x + tw > wr.width - 2) x = ev.clientX - wr.left - tw - 10;
  x = Math.max(2, Math.min(x, wr.width - tw - 2));
  if (y + th > wr.height - 2) y = ev.clientY - wr.top - th - 10;
  y = Math.max(2, y);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('click', ev => { if (!ev.target.closest('#mapwrap')) closeTip(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeTip(); });

function update() { P = project(inp); renderResults(); renderBuilder(); renderMap(); refreshTip(); }
syncUI(); update();

</script>
