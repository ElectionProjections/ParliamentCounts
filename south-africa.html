<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>South Africa Seat Projector</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root {
  color-scheme: light dark;
  --bg: #F3F2ED; --card: #FFFFFF; --border: #D9D6CB; --hair: #E8E6DD;
  --text: #1C2420; --muted: #66706A; --track: #CBD0CA; --field: #FFFFFF; --field-b: #B9BEB6;
  --good: #1B7F46; --bad: #BF3B2D; --gold: #B98A1F; --tip-bg: #FFFFFF; --tip-sh: 0 6px 20px rgba(0,0,0,.18);
  --empty: #E4E2D8; --land: #C9CDC6; --soft: #F6F5F0; --free: #2E9B5B; --partly: #D9A21B; --notfree: #C8493C;
  --focus: #2A6FDB;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111713; --card: #1A231E; --border: #34423A; --hair: #2A362F;
    --text: #ECEAE0; --muted: #9BA89F; --track: #607067; --field: #24302A; --field-b: #55655B;
    --good: #5BCB8A; --bad: #F08A7C; --gold: #D9AE48; --tip-bg: #26322B; --tip-sh: 0 6px 20px rgba(0,0,0,.5);
    --empty: #2C3A32; --land: #5C6B62; --soft: #202B25; --free: #4CBF7C; --partly: #E3B33C; --notfree: #E5675A;
    --focus: #6FA3FF;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
#root { min-height: 100vh; }
.page { max-width: 760px; margin: 0 auto; padding: 18px 12px 44px; display: flex; flex-direction: column; gap: 14px; }
h1 { text-align: center; font-size: clamp(21px, 5.4vw, 28px); font-weight: 600; margin: 6px 0 0; line-height: 1.2; text-wrap: balance; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 14px; min-width: 0; }
.card > h2 { text-align: center; font-size: 17px; font-weight: 600; margin: 0 0 12px; }
.sub { text-align: center; font-size: 14px; font-weight: 600; margin: 0 0 12px; }
.num, .tab { font-variant-numeric: tabular-nums; }
button { font-family: inherit; color: inherit; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* locator row */
.locator { display: flex; justify-content: center; align-items: center; gap: 16px; min-height: 90px; }
.locator svg.world { width: 220px; height: auto; display: block; flex: 0 1 220px; min-width: 0; }
.locator .land { fill: var(--land); }
.locator .flag { width: 50px; flex: 0 0 50px; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; line-height: 0; }
.locator .flag svg { width: 100%; height: auto; display: block; }

/* key facts */
.facts { display: grid; grid-template-columns: 1fr 1fr; padding: 0; }
.facts > div { padding: 16px 8px; text-align: center; min-width: 0; }
.facts > div + div { border-left: 1px solid var(--border); }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.big { font-size: clamp(22px, 6.5vw, 30px); font-weight: 700; margin: 4px 0 2px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.big small { font-size: 13px; font-weight: 500; color: var(--muted); }
.mut { color: var(--muted); font-size: 12px; }
.fbar { height: 6px; border-radius: 3px; background: var(--track); margin: 6px auto 6px; width: min(160px, 80%); overflow: hidden; }
.fbar > i { display: block; height: 100%; border-radius: 3px; }

/* electoral system dropdown */
details.sys { padding: 0; }
details.sys > summary { list-style: none; cursor: pointer; text-align: center; font-weight: 600; padding: 14px 12px; display: flex; justify-content: center; align-items: center; gap: 8px; border-radius: 12px; }
details.sys > summary::-webkit-details-marker { display: none; }
details.sys > summary::marker { content: ''; }
details.sys .chev { width: 10px; height: 10px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s; }
details.sys[open] .chev { transform: rotate(-135deg) translate(-2px, -2px); }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--border); }
.tile { text-align: center; padding: 12px 3px; min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.tile + .tile { border-left: 1px solid var(--border); }
.tile .lbl { font-size: 9px; letter-spacing: .04em; margin-bottom: 3px; }
.tile .v { font-size: 12px; font-weight: 600; line-height: 1.25; }
@media (min-width: 600px) { .tile { padding: 16px 10px; } .tile .lbl { font-size: 10.5px; letter-spacing: .07em; } .tile .v { font-size: 14px; } }

/* inputs */
.irow { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label label" "slider box"; gap: 6px 10px; padding: 11px 0; border-top: 1px solid var(--hair); align-items: center; }
.irow:first-of-type { border-top: 0; padding-top: 2px; }
.irow .nm { grid-area: label; display: flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; }
.irow .nm span.t { min-width: 0; }
.irow .sl { grid-area: slider; min-width: 0; }
.irow .bx { grid-area: box; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
@media (min-width: 620px) { .irow { grid-template-columns: 250px minmax(0, 1fr) 84px; grid-template-areas: "label slider box"; gap: 14px; } }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 10px; }
.acr { color: var(--muted); font-weight: 400; }
.numbox { width: 62px; height: 30px; padding: 0 8px; text-align: right; font: inherit; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text); background: var(--field); border: 1px solid var(--field-b); border-radius: 6px; }
.pct { color: var(--muted); font-size: 12px; width: 12px; }
.rng { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; --pct: 0%; --fill: #888; display: block; }
.rng::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(to right, var(--fill) var(--pct), var(--track) var(--pct)); }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -5px; border-radius: 50%; background: var(--fill); border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--muted); cursor: pointer; }
.rng::-moz-range-track { height: 8px; border-radius: 4px; background: var(--track); }
.rng::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--fill); }
.rng::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--fill); border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--muted); cursor: pointer; }
.rng:active, .rng:active::-webkit-slider-thumb { cursor: grabbing; }
.rng:active::-moz-range-thumb { cursor: grabbing; }
.lockwrap { height: 22px; display: flex; align-items: center; cursor: not-allowed; }
.locktrack { width: 100%; height: 8px; border-radius: 4px; border: 1px dashed var(--muted); overflow: hidden; background: transparent; }
.locktrack > i { display: block; height: 100%; background: repeating-linear-gradient(135deg, var(--muted) 0 3px, transparent 3px 6px); }
.lockval { min-width: 62px; height: 30px; padding: 0 8px; display: flex; align-items: center; justify-content: flex-end; border: 1px dashed var(--field-b); border-radius: 6px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; cursor: not-allowed; }
.nm .lk { color: var(--muted); flex: 0 0 auto; }
.btn { border: 1px solid var(--field-b); background: transparent; border-radius: 6px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; }
.btn:hover { background: var(--soft); }
.center { display: flex; justify-content: center; }

/* results */
.hemi { display: block; width: 100%; max-width: 650px; margin: 0 auto; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 18px 0 18px; font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
.rtable { width: 100%; font-size: 12.5px; }
.rtable .tr { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1.15fr)) minmax(0, .75fr); column-gap: 4px; padding: 5px 2px; border-top: 1px solid var(--hair); align-items: center; }
.rtable .th { border-top: 0; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 10.5px; color: var(--muted); align-items: end; padding-top: 2px; }
.rtable .c { text-align: right; font-variant-numeric: tabular-nums; min-width: 0; }
.rtable .pn { display: flex; gap: 7px; align-items: flex-start; min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.rtable .pn .sw { margin-top: 4px; }
.rtable .seats { font-weight: 700; }
.pos { color: var(--good); } .neg { color: var(--bad); } .zero { color: var(--muted); }
@media (min-width: 620px) { .rtable { font-size: 13.5px; } .rtable .th { font-size: 12px; } .rtable .tr { column-gap: 10px; padding: 5px 6px; } }

/* coalition */
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 2px 0 24px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--field-b); background: transparent; font-size: 12.5px; cursor: pointer; }
.chip:hover { background: var(--soft); }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--text); font-weight: 600; }
.cbar { position: relative; height: 16px; border-radius: 8px; background: var(--track); margin: 0 6px; }
.cbar .seg { position: absolute; top: 0; bottom: 0; }
.cbar .fillwrap { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; display: flex; }
.cbar .maj { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--text); border-radius: 1px; }
.cnote { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; }
.ok { color: var(--good); font-weight: 600; }

/* map */
.seg2 { display: flex; justify-content: center; gap: 0; margin: 0 auto 12px; border: 1px solid var(--field-b); border-radius: 8px; overflow: hidden; width: fit-content; max-width: 100%; }
.seg2 button { border: 0; background: transparent; padding: 6px 14px; font-size: 13px; cursor: pointer; }
.seg2 button + button { border-left: 1px solid var(--field-b); }
.seg2 button[aria-pressed="true"] { background: var(--text); color: var(--card); font-weight: 600; }
.mapwrap { position: relative; max-width: 650px; margin: 0 auto; }
.mapwrap svg { width: 100%; display: block; -webkit-tap-highlight-color: transparent; }
.area { stroke: var(--card); stroke-width: 0.8; vector-effect: non-scaling-stroke; cursor: pointer; outline: none; transition: filter .12s; }
.area:hover, .area.sel { filter: brightness(.82); }
.zoom { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 4px; z-index: 4; }
.zoom button { width: 30px; height: 30px; border: 1px solid var(--field-b); background: var(--card); border-radius: 6px; font-size: 15px; line-height: 1; cursor: pointer; padding: 0; }
.tip { position: absolute; z-index: 10; background: var(--tip-bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--tip-sh); padding: 8px 10px; width: 214px; font-size: 12px; pointer-events: none; transform: translate(-50%, -100%); }
.tip .tt { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 600; font-size: 13px; padding-bottom: 5px; margin-bottom: 4px; border-bottom: 1px solid var(--hair); }
.tip .tt span.m { font-weight: 400; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.tip .tr2 { display: grid; grid-template-columns: 8px minmax(0, 1fr) 38px; column-gap: 6px; align-items: start; padding: 1.5px 0; }
.tip .tr2.s { grid-template-columns: 8px minmax(0, 1fr) 38px 64px; }
.tip .tr2 .sw { width: 8px; height: 8px; flex-basis: 8px; margin-top: 3px; border-radius: 2px; }
.tip .tr2 .p { text-align: right; font-variant-numeric: tabular-nums; }
.tip .sq { display: grid; grid-template-columns: repeat(10, 5px); gap: 1.5px; padding-top: 3px; }
.tip .sq i { width: 5px; height: 5px; border-radius: 1px; display: block; }
.maplegend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 14px; font-size: 12.5px; }
.maplegend span { display: inline-flex; align-items: center; gap: 6px; }
.cbarlg { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; font-size: 12.5px; }
.cbarlg i { display: block; width: 160px; max-width: 45vw; height: 10px; border-radius: 5px; }

/* probability model */
.pm { position: relative; overflow: hidden; }
.pm hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
.pm .prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--text); transition: width .1s; }
.pm .res { transition: opacity .15s; }
.pm .res.stale { opacity: .4; }
.chipsrow { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }
.chipsrow .chip { padding: 4px 11px; }
.setgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; margin-top: 18px; }
@media (max-width: 560px) { .setgrid { grid-template-columns: 1fr; } }
.setitem { text-align: center; }
.setitem .lbl2 { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; line-height: 1.35; }
@media (min-width: 561px) { .setitem .lbl2 { min-height: 2.7em; } }
.setitem .val { margin-top: 8px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.obar { height: 26px; border-radius: 6px; overflow: hidden; display: flex; background: var(--track); }
.olegend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; margin-top: 14px; font-size: 12.5px; }
.olegend span { display: inline-flex; align-items: center; gap: 7px; }
.olegend i { width: 14px; height: 14px; border-radius: 3px; display: block; flex: 0 0 14px; }
.stbl .tr { display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(150px, 1.5fr); column-gap: 12px; padding: 6px 0; border-top: 1px solid var(--hair); align-items: center; }
.stbl .th { border-top: 0; border-bottom: 1px solid var(--border); padding: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--muted); }
.stbl .c { text-align: center; font-variant-numeric: tabular-nums; }
.rangecell { min-width: 150px; }
.rangecell .rt { text-align: center; font-size: 12px; line-height: 1.2; font-variant-numeric: tabular-nums; margin-bottom: 3px; }
.rbar { position: relative; height: 7px; border-radius: 4px; background: var(--track); }
.rbar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.rbar b { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--text); border-radius: 1px; }
.mcard { background: var(--soft); border: 1px solid var(--border); border-radius: 14px; padding: 18px 14px; text-align: center; margin-top: 18px; }
.mcard .bigp { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.mcard .bigp small { font-size: 20px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.mcard .cl { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 4px 0 12px; }
.mcard .mb { height: 6px; border-radius: 3px; background: var(--track); max-width: 320px; margin: 0 auto; overflow: hidden; }
.mcard .mb i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.mstats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.mstats > div + div { border-left: 1px solid var(--border); }
.mstats .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hist { position: relative; height: 150px; display: flex; align-items: flex-end; gap: 1px; border-bottom: 1px solid var(--muted); touch-action: pan-y; cursor: crosshair; }
.hist .b { flex: 1 1 0; min-width: 0; border-radius: 1px 1px 0 0; transition: opacity .08s; }
.hist.hov .b { opacity: .35; }
.hist.hov .b.on { opacity: 1; }
.hist .thr { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--text); pointer-events: none; }
.haxis { position: relative; height: 18px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.haxis span { position: absolute; transform: translateX(-50%); top: 3px; white-space: nowrap; }
.htip { height: 38px; text-align: center; font-size: 12.5px; line-height: 1.5; margin: 12px 0 6px; font-variant-numeric: tabular-nums; }
.htip div:first-child { font-weight: 600; }
.src { text-align: center; font-size: 11.5px; color: var(--muted); line-height: 1.6; margin: 4px 0 0; }
.hatch { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.65) 0 3px, transparent 3px 7px); }

@media (max-width: 420px) { .card { padding: 16px 10px; } .facts { padding: 0; } }
@media (max-width: 420px) { .rtable .th { font-size: 10px; } }
.histwrap { padding: 0 14px; }

</style>
