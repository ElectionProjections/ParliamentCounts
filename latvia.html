<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latvia Seat Projector</title>
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>

<style>
/* Layout: one centred working column of separate cards, ordered inputs, results, coalition, map. */
:root {
  --bg: #eceff3;
  --card: #ffffff;
  --fg: #1c2230;
  --muted: #667085;
  --line: #d9dee6;
  --track: #e4e8ee;
  --tint: #eef1f5;
  --pos: #1d7a4a;
  --neg: #b4332f;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b2029; --fg: #e5e8ee; --muted: #9aa3b5; --line: #2c3342;
    --track: #2a3140; --tint: #2a3040; --pos: #5bc88a; --neg: #ef7d78; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --card: #1b2029; --fg: #e5e8ee; --muted: #9aa3b5; --line: #2c3342;
  --track: #2a3140; --tint: #2a3040; --pos: #5bc88a; --neg: #ef7d78; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; line-height: 1.35; padding-inline: 16px; padding-block: 14px; }
main { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; min-width: 0; }
h1 { font-size: 20px; font-weight: 700; text-align: center; margin: 2px 0 0; letter-spacing: .005em; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 650; text-align: center; margin: 0 0 10px; letter-spacing: .01em; }
.btn { font: inherit; font-size: 12px; line-height: 1.2; padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; -webkit-tap-highlight-color: transparent; }
.btn:hover { border-color: var(--muted); }
.btn.on { background: var(--fg); color: var(--card); border-color: var(--fg); }
.btn:focus-visible { outline: 2px solid var(--muted); outline-offset: 1px; }
.sw { width: 9px; height: 9px; border-radius: 2px; flex: none; display: inline-block; }
.btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }

/* inputs */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 54px; align-items: center; column-gap: 10px; row-gap: 0; padding: 4px 0 4px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; padding-top: 0; }
.row:last-child { padding-bottom: 0; }
.row .nm { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12.5px; line-height: 1.2; }
.row .nm .sw { width: 11px; height: 11px; border-radius: 3px; }
.row .nm b { font-weight: 650; }
.row input[type=number] { width: 54px; font: inherit; font-size: 12.5px; font-weight: 600; padding: 1px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--card); color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.row input[type=number]::-webkit-outer-spin-button, .row input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.row input[type=range] { grid-column: 1 / -1; -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0; background: transparent; --c: var(--muted); --r: 0; cursor: pointer; }
.row input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--c) calc(7px + (100% - 14px) * var(--r)), var(--track) calc(7px + (100% - 14px) * var(--r))); }
.row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--card); border: 3px solid var(--c); }
.row input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: var(--track); }
.row input[type=range]::-moz-range-progress { height: 5px; border-radius: 3px; background: var(--c); }
.row input[type=range]::-moz-range-thumb { width: 8px; height: 8px; border-radius: 50%; background: var(--card); border: 3px solid var(--c); }
.row input[type=range]:focus-visible { outline: none; }
.row input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
.row input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
.row.oth { color: var(--muted); }
.row.oth input { opacity: .55; cursor: default; }

/* results */
.gfx { max-width: 650px; margin: 0 auto; }
.gfx svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; margin-top: 16px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
table.res { width: 100%; max-width: 650px; margin: 18px auto 0; border-collapse: collapse; font-variant-numeric: tabular-nums; display: table; }
.res th { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.res td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); font-size: 13px; }
.res tr:last-child td { border-bottom: 0; }
.res th:first-child, .res td:first-child { text-align: left; padding-left: 2px; }
.res th:last-child, .res td:last-child { padding-right: 2px; }
.res .nmc { display: flex; align-items: center; gap: 8px; }
.res td:first-child .sw { width: 12px; height: 12px; border-radius: 3px; }
.res td:first-child b { font-weight: 650; }
.res td.st { font-weight: 650; }
.res .pos { color: var(--pos); } .res .neg { color: var(--neg); }

/* coalition */
.bar { position: relative; height: 16px; background: var(--track); border-radius: 4px; display: flex; max-width: 650px; margin: 22px auto 24px; }
.bar .seg { height: 100%; }
.bar .seg:first-child { border-radius: 4px 0 0 4px; }
.bar .mk { position: absolute; left: 51%; top: -5px; height: 26px; width: 2px; margin-left: -1px; background: var(--fg); }
.bar .mk b { position: absolute; top: 27px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* map */
.mapbtns { margin-bottom: 8px; }
.mapwrap { position: relative; max-width: 650px; margin: 0 auto; }
.mapwrap svg { display: block; width: 100%; height: auto; }
.reg, .dia { cursor: pointer; outline: none; stroke: var(--card); stroke-width: 1.2; stroke-linejoin: round; transition: fill .15s; }
.dia { stroke-width: 1.2; }
.dlab { fill: var(--fg); font-size: 26px; font-weight: 600; text-anchor: middle; pointer-events: none; font-family: var(--font); }
.reg:hover, .dia:hover, .reg.sel, .dia.sel { filter: brightness(.88); }
.tip { position: absolute; z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px 6px; box-shadow: 0 4px 14px rgba(0,0,0,.18); font-size: 11.5px; font-variant-numeric: tabular-nums; pointer-events: auto; }
.tip .th { font-weight: 650; text-align: center; padding: 1px 4px 4px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
.tip table { border-collapse: collapse; }
.tip td { padding: 1px 4px; white-space: nowrap; }
.tip td.p { text-align: right; }
.tip td.d { padding-left: 8px; }
.tip tr.h td { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-bottom: 2px; }
.tip tr.h td.p { text-align: right; }
.tip .sd { display: flex; align-items: center; gap: 6px; }
.tip .sd b { min-width: 14px; text-align: right; font-weight: 650; }
.tip .dots { display: flex; flex-wrap: wrap; gap: 2px; max-width: 120px; }
.tip .sw { margin-right: 5px; vertical-align: -0.5px; }
.dot { display: block; width: 7px; height: 7px; border-radius: 50%; }
.maplegend { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 12px; margin-top: 12px; font-size: 12px; }
.maplegend span { display: inline-flex; align-items: center; gap: 5px; }
.grad { width: 110px; height: 8px; border-radius: 4px; }
.src { text-align: center; color: var(--muted); font-size: 11.5px; margin: 4px 0 2px; }
.src a { color: inherit; }
</style>

  <h1>Latvia Seat Projector</h1>

    }
    function sainteLague(votes, eligible, seats) {
      const got = votes.map(() => 0);
      for (let s = 0; s < seats; s++) {
        let best = -1, bq = -1;
        for (let i = 0; i < votes.length; i++) {
          if (!eligible[i]) continue;
          const q = votes[i] / (2 * got[i] + 1);
          if (q > bq) { bq = q; best = i; }
        }
        if (best < 0) break;
        got[best]++;
      }
      return got;
    }
    function project(national) { // national: array of list shares (% of valid envelopes), same order as parties
      const sw = national.map((s, i) => s - baseNat[i]);
      const other = 100 - national.reduce((a, b) => a + b, 0);
      const swO = other - baseOther;
      const pass = national.map(s => s >= 5 - 1e-9);
      const taper = national.map((s, i) => baseNat[i] > 0 ? Math.min(1, Math.max(0, s) / (TAPER * baseNat[i])) : 1);
      const con = D.cons.map((_, c) => {
        const sh = applySwing(baseCon[c], sw, swO, taper);
        const seats = sainteLague(sh.lists, pass, D.seats[c]);
        return { shares: sh.lists, other: sh.other, seats };
      });
      const abroad = applySwing(baseAbroad, sw, swO, taper);
      const seats = P.map((_, i) => con.reduce((a, c) => a + c.seats[i], 0));
      return { con, abroad, seats, pass };
    }
    return { project, baseNat, baseOther, baseCon, baseAbroad, sainteLague };
  }
  if (typeof module !== 'undefined') module.exports = makeEngine; else root.makeEngine = makeEngine;
})(this);

const E = makeEngine(D);
const P = D.parties, N = P.length;
const baseSeats = E.project(E.baseNat).seats;
const vals = E.baseNat.slice();
// Parties without a slider share the "Other" remainder, in proportion to their baseline national shares.
// Blank/invalid envelopes stay at their baseline share (up to what Other leaves them).
const isSlider = i => P[i].slider !== false;
const sliderSum = () => vals.reduce((a, v, i) => isSlider(i) ? a + v : a, 0);
const BLANK = E.baseOther;
const minorBase = P.reduce((a, p, i) => isSlider(i) ? a : a + E.baseNat[i], 0);
function national() {
  const o = Math.max(0, 100 - sliderSum()), blank = Math.min(o, BLANK), pool = o - blank;
  return P.map((p, i) => isSlider(i) ? vals[i] : pool * E.baseNat[i] / minorBase);
}
let nat = E.baseNat.slice();
const byShare = () => P.map((p, i) => i).sort((a, b) => nat[b] - nat[a] || a - b);
const coal = new Set();
let mapMode = 'winner';
let sel = null;      // selected area: 0-4 constituency index, or 'a' for the diaspora circle
let tipPos = null;
let proj = null;

const $ = id => document.getElementById(id);
const f1 = x => (Math.round(x * 10) / 10 + 0).toFixed(1);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const label = p => esc(p.name) + ' (' + esc(p.id) + ')';
const labelB = p => esc(p.name) + ' <b>(' + esc(p.id) + ')</b>';
const sum = a => a.reduce((x, y) => x + y, 0);

/* ---------- inputs ---------- */
const sliders = [], nums = [];
let othSlider, othNum;
(function buildInputs() {
  const rows = $('rows');
  P.forEach((p, i) => {
    if (!isSlider(i)) return;
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<div class="nm"><span class="sw" style="background:' + p.color + '"></span><span>' + esc(p.name) + ' <b>(' + esc(p.id) + ')</b></span></div>' +
      '<input type="number" min="0" max="60" step="0.1" id="n-' + i + '" inputmode="decimal" aria-label="' + esc(p.id) + ' %">' +
      '<input type="range" min="0" max="60" step="0.1" id="s-' + i + '" style="--c:' + p.color + '" aria-label="' + esc(p.id) + '">';
    rows.appendChild(r);
    const s = r.querySelector('input[type=range]'), n = r.querySelector('input[type=number]');
    sliders.push(s); nums.push(n);
    s.addEventListener('input', () => { setVal(i, s.value); sync(); update(); });
    n.addEventListener('input', () => {
      if (n.value === '') return;
      setVal(i, n.value);
      if (parseFloat(n.value) !== vals[i]) n.value = f1(vals[i]);
      sync(i); update();
    });
    n.addEventListener('change', () => { if (n.value === '') setVal(i, 0); n.value = f1(vals[i]); sync(); update(); });
  });
  const r = document.createElement('div'); r.className = 'row oth';
  r.innerHTML = '<div class="nm"><span class="sw" style="background:var(--muted)"></span><span>Other</span></div>' +
    '<input type="number" id="n-oth" readonly tabindex="-1" aria-label="Other %">' +
    '<input type="range" min="0" max="60" step="0.1" id="s-oth" disabled aria-label="Other">';
  rows.appendChild(r);
  othSlider = r.querySelector('input[type=range]'); othNum = r.querySelector('input[type=number]');
})();

function setVal(i, raw) {
  let v = parseFloat(raw); if (!isFinite(v)) v = 0;
  v = Math.round(Math.min(60, Math.max(0, v)) * 10) / 10;
  const room = Math.max(0, 100 - (sliderSum() - vals[i]));
  if (v > room) v = Math.floor(room * 10 + 1e-9) / 10;
  vals[i] = v;
}
function sync(skip) {
  vals.forEach((v, i) => {
    if (!isSlider(i)) return;
    sliders[i].value = v; sliders[i].style.setProperty('--r', v / 60);
    if (i !== skip) nums[i].value = f1(v);
  });
  const o = Math.max(0, 100 - sliderSum());
  othSlider.value = o; othSlider.style.setProperty('--r', Math.min(1, o / 60)); othNum.value = f1(o);
}

/* ---------- hemicycle ---------- */
function seatLayout(total, rows) {
  const R = 300, r0 = 120, radii = [];
  for (let k = 0; k < rows; k++) radii.push(r0 + (R - r0) * k / (rows - 1));
  const w = sum(radii), raw = radii.map(r => total * r / w), cnt = raw.map(Math.floor);
  let left = total - sum(cnt);
  raw.map((x, k) => [x - Math.floor(x), k]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, k]) => cnt[k]++);
  const pts = [];
  radii.forEach((r, k) => {
    for (let j = 0; j < cnt[k]; j++) {
      const th = cnt[k] === 1 ? Math.PI / 2 : Math.PI - Math.PI * j / (cnt[k] - 1);
      pts.push({ th, r, x: 325 + r * Math.cos(th), y: 318 - r * Math.sin(th) });
    }
  });
  pts.sort((a, b) => b.th - a.th || a.r - b.r);
  return pts;
}
const HEMI = seatLayout(100, 6);
const HR = 0.43 * Math.min((300 - 120) / 5, Math.PI * 300 / 25);

function renderHemi(seats) {
  let i = 0, left = seats[0], c = '';
  const out = [];
  HEMI.forEach(pt => {
    while (left === 0 && i < N - 1) { i++; left = seats[i]; }
    out.push('<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="' + HR.toFixed(1) + '" fill="' + P[i].color + '"/>');
    left--;
  });
  $('hemi').innerHTML = '<svg viewBox="0 0 650 335" role="img" aria-label="Hemicycle">' + out.join('') + '</svg>';
  $('hemileg').innerHTML = P.map((p, k) => seats[k] > 0 ? '<span><i class="sw" style="background:' + p.color + '"></i>' + esc(p.id) + '</span>' : '').join('');
}

/* ---------- table ---------- */
function visible(i, seats) { return nat[i] >= 1 - 1e-9 || seats[i] > 0; }
function renderTable(seats) {
  const rows = [];
  byShare().forEach(i => {
    const p = P[i];
    if (!visible(i, seats)) return;
    const d = seats[i] - baseSeats[i];
    rows.push('<tr><td><div class="nmc"><i class="sw" style="background:' + p.color + '"></i><span>' + labelB(p) + '</span></div></td><td>' + f1(nat[i]) + '</td><td class="st">' + seats[i] + '</td><td class="' + (d > 0 ? 'pos' : d < 0 ? 'neg' : '') + '">' + (d > 0 ? '+' + d : d < 0 ? '−' + (-d) : '0') + '</td></tr>');
  });
  $('tbl').tBodies[0].innerHTML = rows.join('');
}

/* ---------- coalition ---------- */
function renderCoal(seats) {
  [...coal].forEach(i => { if (seats[i] === 0) coal.delete(i); });
  const box = $('coalbtns');
  box.innerHTML = '';
  P.map((p, i) => i).sort((a, b) => seats[b] - seats[a] || nat[b] - nat[a] || a - b).forEach(i => {
    const p = P[i];
    if (seats[i] === 0) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn';
    b.innerHTML = '<i class="sw" style="background:' + p.color + '"></i>' + esc(p.id);
    if (coal.has(i)) { b.style.background = 'color-mix(in srgb, ' + p.color + ' 24%, var(--card))'; b.style.borderColor = p.color; }
    b.addEventListener('click', () => { coal.has(i) ? coal.delete(i) : coal.add(i); renderCoal(proj.seats); });
    box.appendChild(b);
  });
  const bar = $('bar');
  bar.querySelectorAll('.seg').forEach(s => s.remove());
  const mk = bar.querySelector('.mk');
  P.forEach((p, i) => {
    if (!coal.has(i)) return;
    const s = document.createElement('div'); s.className = 'seg';
    s.style.width = seats[i] + '%'; s.style.background = p.color;
    bar.insertBefore(s, mk);
  });
}

/* ---------- map ---------- */
const NS = 'http://www.w3.org/2000/svg';
const mapEl = $('map');
const regEls = [];
let diaEl;
(function buildMap() {
  const g = document.createElementNS(NS, 'g'); g.setAttribute('transform', 'translate(70 0)');
  D.cons.forEach((c, k) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', G.paths[c]); p.setAttribute('fill-rule', 'evenodd'); p.setAttribute('class', 'reg');
    p.addEventListener('click', e => openTip(k, e));
    g.appendChild(p); regEls.push(p);
  });
  mapEl.appendChild(g);
  diaEl = document.createElementNS(NS, 'circle');
  diaEl.setAttribute('cx', 48); diaEl.setAttribute('cy', 76); diaEl.setAttribute('r', 34); diaEl.setAttribute('class', 'dia');
  diaEl.addEventListener('click', e => openTip('a', e));
  mapEl.appendChild(diaEl);
  const lab = document.createElementNS(NS, 'text');
  lab.setAttribute('x', 48); lab.setAttribute('y', 26); lab.setAttribute('class', 'dlab'); lab.textContent = 'Abroad';
  mapEl.appendChild(lab);
})();

function areaData(k) { return k === 'a' ? { shares: proj.abroad.lists, seats: null } : { shares: proj.con[k].shares, seats: proj.con[k].seats }; }
function winnerOf(shares) { let b = 0; shares.forEach((s, i) => { if (s > shares[b]) b = i; }); return b; }

function renderMap() {
  const areas = [0, 1, 2, 3, 4, 'a'];
  const el = k => k === 'a' ? diaEl : regEls[k];
  const winners = new Set();
  if (mapMode === 'winner') {
    areas.forEach(k => { const w = winnerOf(areaData(k).shares); winners.add(w); el(k).style.fill = P[w].color; });
    $('maplegend').innerHTML = P.map((p, i) => winners.has(i) ? '<span><i class="sw" style="background:' + p.color + '"></i>' + esc(p.id) + '</span>' : '').join('');
  } else {
    const i = +mapMode, p = P[i];
    const v = areas.map(k => areaData(k).shares[i]);
    const lo = Math.min(...v), hi = Math.max(...v);
    areas.forEach((k, j) => {
      const t = hi > lo ? (v[j] - lo) / (hi - lo) : 1;
      el(k).style.fill = 'color-mix(in srgb, ' + p.color + ' ' + (14 + 86 * t).toFixed(1) + '%, var(--tint))';
    });
    $('maplegend').innerHTML = '<span>Weakest</span><i class="grad" style="background:linear-gradient(90deg, color-mix(in srgb, ' + p.color + ' 14%, var(--tint)), ' + p.color + ')"></i><span>Strongest</span>';
  }
  // buttons
  const box = $('mapbtns'); box.innerHTML = '';
  const mk = (txt, val, color) => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'btn' + (String(mapMode) === String(val) ? ' on' : '');
    b.innerHTML = (color ? '<i class="sw" style="background:' + color + '"></i>' : '') + esc(txt);
    b.addEventListener('click', () => { mapMode = val; renderMap(); });
    box.appendChild(b);
  };
  mk('Winner', 'winner');
  P.forEach((p, i) => { if (nat[i] >= 1 - 1e-9) mk(p.id, i, p.color); });
  if (mapMode !== 'winner' && !(nat[+mapMode] >= 1 - 1e-9)) { mapMode = 'winner'; renderMap(); return; }
  areas.forEach(k => el(k).classList.toggle('sel', sel === k));
}

/* ---------- tooltip ---------- */
let tipEl = null;
function tipHtml(k) {
  const { shares, seats } = areaData(k);
  const rows = P.map((p, i) => ({ p, s: shares[i], n: seats ? seats[i] : 0 }))
    .filter(r => r.s >= 1 || r.n > 0).sort((a, b) => b.s - a.s);
  const body = rows.map(r => '<tr><td><i class="sw" style="background:' + r.p.color + '"></i>' + esc(r.p.id) + '</td><td class="p">' + f1(r.s) + '%</td>' +
    (seats ? '<td class="d"><div class="sd"><b>' + r.n + '</b><span class="dots">' + Array(r.n).fill('<i class="dot" style="background:' + r.p.color + '"></i>').join('') + '</span></div></td>' : '') + '</tr>').join('');
  return '<div class="th">' + esc(k === 'a' ? 'Abroad' : D.cons[k]) + '</div><table>' + body + '</table>';
}
function placeTip(x, y) {
  const w = $('mapwrap'), W = w.clientWidth, H = w.clientHeight;
  tipEl.style.left = '0px'; tipEl.style.top = '0px';
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let l = x + 10, t = y + 10;
  if (l + tw > W) l = Math.max(0, x - tw - 10);
  if (t + th > H) t = Math.max(0, y - th - 10);
  tipEl.style.left = l + 'px'; tipEl.style.top = t + 'px';
}
function openTip(k, e) {
  e.stopPropagation();
  sel = k;
  const r = $('mapwrap').getBoundingClientRect();
  tipPos = [e.clientX - r.left, e.clientY - r.top];
  if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.addEventListener('click', ev => ev.stopPropagation()); $('mapwrap').appendChild(tipEl); }
  tipEl.innerHTML = tipHtml(k);
  placeTip(tipPos[0], tipPos[1]);
  renderMapSel();
}
function closeTip() { sel = null; if (tipEl) { tipEl.remove(); tipEl = null; } renderMapSel(); }
function renderMapSel() { [0, 1, 2, 3, 4, 'a'].forEach(k => (k === 'a' ? diaEl : regEls[k]).classList.toggle('sel', sel === k)); }
document.addEventListener('click', e => { if (sel !== null && !e.target.closest('.reg, .dia, .tip')) closeTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTip(); });

/* ---------- update ---------- */
function update() {
  nat = national();
  proj = E.project(nat);
  renderHemi(proj.seats);
  renderTable(proj.seats);
  renderCoal(proj.seats);
  renderMap();
  if (tipEl && sel !== null) { tipEl.innerHTML = tipHtml(sel); placeTip(tipPos[0], tipPos[1]); }
}
sync();
update();
</script>
