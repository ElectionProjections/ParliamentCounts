<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japan Seat Projector</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
:root{
  --bg:#F2F1EC;--card:#FFFFFF;--fg:#1E2024;--muted:#6B6E76;--border:#DCDAD2;--line:#E7E5DE;
  --track:#D3D1C8;--fill:#3E4E6B;--thumb:#FFFFFF;--chip:#F1F0EA;--chip-on:#1E2024;--chip-on-fg:#FFFFFF;
  --good:#1B8449;--bad:#C0392B;--maptrack:#E1DFD6;--land:#C9C8C0;--hl:#D6283A;--soft:#F6F5F0;--ring:rgba(0,0,0,.22);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--card:#1B1E23;--fg:#E7E8EB;--muted:#9B9FA8;--border:#30343B;--line:#292D33;
  --track:#667085;--fill:#9DB8EC;--thumb:#E7E8EB;--chip:#262A31;--chip-on:#E7E8EB;--chip-on-fg:#14161A;
  --good:#4CC38A;--bad:#F0786B;--maptrack:#2F343C;--land:#4A5058;--hl:#F2495A;--soft:#20242A;--ring:rgba(255,255,255,.38);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417;--card:#1B1E23;--fg:#E7E8EB;--muted:#9B9FA8;--border:#30343B;--line:#292D33;
  --track:#667085;--fill:#9DB8EC;--thumb:#E7E8EB;--chip:#262A31;--chip-on:#E7E8EB;--chip-on-fg:#14161A;
  --good:#4CC38A;--bad:#F0786B;--maptrack:#2F343C;--land:#4A5058;--hl:#F2495A;--soft:#20242A;--ring:rgba(255,255,255,.38);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
.page{max-width:760px;margin:0 auto;padding-block:20px 36px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;text-align:center;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0 0 12px;text-align:center;font-size:17px;font-weight:650;line-height:1.25}
h3{margin:0 0 12px;text-align:center;font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 14px;min-width:0}
.locator{display:flex;align-items:center;justify-content:center;gap:16px;min-height:90px}
.locator svg.world{width:220px;max-width:calc(100% - 70px);height:auto;display:block}
.flag{width:50px;flex:none;border:1px solid var(--border);border-radius:3px;overflow:hidden;line-height:0}
.flag svg{width:100%;height:auto;display:block}
.facts{display:grid;grid-template-columns:1fr 1fr;padding:0}
.facts>div{padding:14px 10px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.facts>div+div{border-left:1px solid var(--border)}
.lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-size:28px;font-weight:700;line-height:1.1}
.big small{font-size:14px;font-weight:500;color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.fhbar{width:100%;max-width:150px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0}
.fhbar i{display:block;height:100%;background:var(--good);border-radius:99px}
details.sys{padding:0}
details.sys summary{list-style:none;cursor:pointer;text-align:center;font-weight:600;padding:13px 14px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px}
details.sys summary::-webkit-details-marker{display:none}
details.sys summary:focus-visible{outline:2px solid var(--fill);outline-offset:-2px}
details.sys .chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
details.sys[open] .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.sysbody{border-top:1px solid var(--border)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tiles>div{padding:12px 4px;text-align:center;min-width:0;overflow-wrap:anywhere}
.tiles>div+div{border-left:1px solid var(--border)}
.tiles .lab{font-size:9px;letter-spacing:.05em;display:block;margin-bottom:4px}
.tiles .val{font-size:12px;font-weight:600;line-height:1.25;display:block}
.tiles.det{grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--border)}
@media (min-width:600px){.tiles>div{padding:16px 10px}.tiles .lab{font-size:10.5px}.tiles .val{font-size:14px}}
/* inputs */
.row{padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr;gap:8px}
.row:last-of-type{border-bottom:0}
.row .nm{display:flex;align-items:center;gap:8px;font-weight:550;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--ring)}
.row .ctl{display:flex;align-items:center;gap:12px}
@media (min-width:600px){.row{grid-template-columns:minmax(0,260px) minmax(0,1fr);align-items:center;gap:14px}}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:8px;border-radius:99px;margin:0;cursor:pointer;
  background:linear-gradient(to right,var(--fc,var(--fill)) var(--p,0%),var(--track) var(--p,0%));outline:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:transparent;border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--thumb);border:2px solid var(--fc,var(--fill));margin-top:-6px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{height:8px;background:var(--track);border-radius:99px}
input[type=range]::-moz-range-progress{height:8px;background:var(--fc,var(--fill));border-radius:99px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--thumb);border:2px solid var(--fc,var(--fill));cursor:pointer}
input[type=range]:active,input[type=range]::-webkit-slider-thumb:active{cursor:pointer}
input[type=range]:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--fill) 35%,transparent)}
input[type=range]:disabled{cursor:not-allowed;background:repeating-linear-gradient(45deg,var(--track) 0 5px,transparent 5px 10px),var(--soft);opacity:.75}
input[type=range]:disabled::-webkit-slider-thumb{visibility:hidden}
input[type=range]:disabled::-moz-range-thumb{visibility:hidden}
input[type=range]:disabled::-moz-range-progress{background:transparent}
input[type=range]:disabled::-moz-range-track{background:transparent}
.nb{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:7px;padding:0 7px;background:var(--card);height:30px;flex:none}
.nb input{width:46px;border:0;background:transparent;color:var(--fg);font:inherit;font-weight:600;text-align:right;padding:0;outline:none;font-variant-numeric:tabular-nums}
.nb:focus-within{border-color:var(--fill);box-shadow:0 0 0 2px color-mix(in srgb,var(--fill) 30%,transparent)}
.nb.dis{background:var(--soft);color:var(--muted);border-style:dashed}
.nb.dis input{color:var(--muted);cursor:not-allowed}
.btn{font:inherit;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--chip);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.center{display:flex;justify-content:center}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--border);background:var(--chip);color:var(--fg);cursor:pointer;line-height:1.2}
.chip[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.chip.pc[aria-pressed=true]{border-color:transparent}
/* results */
.hemi{width:100%;max-width:650px;margin:0 auto;display:block;height:auto}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:14px 0 16px;font-size:12px;font-weight:550}
.legend span{display:inline-flex;align-items:center;gap:5px}
.rt{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:auto}
.rt th{font-size:10px;font-weight:600;color:var(--muted);padding:4px 2px;text-align:center;line-height:1.15;vertical-align:bottom}
.rt thead tr:first-child th{border-bottom:0}
.rt thead tr:last-child th{border-bottom:1px solid var(--border);padding-bottom:7px}
.rt th.g{border-bottom:1px solid var(--border)!important;padding-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.rt th.l,.rt td.l{text-align:left}
.rt td{padding:9px 2px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.rt tr:last-child td{border-bottom:0}
.rt td.l{padding-right:4px;line-height:1.25}
.rt td.l .pn{display:flex;align-items:flex-start;gap:6px}
.rt td.l .dot{margin-top:3px}
.rt td.s{font-weight:700;font-size:13.5px}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}.zero{color:var(--muted)}
@media (min-width:600px){.rt{font-size:13.5px}.rt th{font-size:11px;padding:4px 6px}.rt td{padding:10px 6px}}
/* coalition */
.cbuttons{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:22px}
.cbar{position:relative;height:16px;border-radius:99px;background:var(--line);display:flex;overflow:hidden;margin:0 6px}
.cwrap{position:relative;margin:0 0 4px}
.cmaj{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);transform:translateX(-1px);border-radius:1px}
.cmajl{position:absolute;top:100%;margin-top:7px;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--muted)}
.cstat{text-align:center;margin-top:30px;font-weight:600}
.cstat .good{color:var(--good);margin-left:8px}
/* map */
.mapmodes{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:12px}
.mapwrap{position:relative;margin:0 -14px;overflow:hidden}
.mapwrap svg.map{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;outline:none}
.dist{cursor:pointer;outline:none;transition:fill .25s}
.dist:hover{filter:brightness(.86)}.dist.sel{filter:brightness(.74)}
.zoom{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--fg);font:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0}
.pop{position:absolute;z-index:5;width:172px;background:var(--card);border:1px solid var(--border);border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.22);padding:8px 10px;font-size:12px}
.pop .t{font-weight:700;padding-bottom:5px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.pop .r{display:flex;align-items:center;gap:6px;padding:2px 0}
.pop .r b{font-weight:700}.pop .r .v{margin-left:auto}
.mlegend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:14px;font-size:12px;font-weight:550;align-items:center}
.mlegend span{display:inline-flex;align-items:center;gap:5px}
.cbar2{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.cbar2 i{display:block;width:180px;max-width:50vw;height:10px;border-radius:99px}
/* probability */
.sec+.sec{border-top:1px solid var(--line);margin-top:24px;padding-top:24px}
.mcsl{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
@media (max-width:599px){.mcsl{grid-template-columns:1fr}}
.mcsl .one{display:flex;flex-direction:column;align-items:stretch;gap:12px;min-width:0}
.mcsl label{text-align:center;font-size:12.5px;font-weight:550}
.mcsl .val{text-align:center;font-weight:700}
.prog{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:var(--fill);width:0}
.prog.idle{visibility:hidden}
.obar{height:26px;border-radius:7px;overflow:hidden;display:flex;background:var(--line)}
.olegend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:14px;font-size:12px;font-weight:550}
.olegend span{display:inline-flex;align-items:center;gap:6px}
.olegend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.srt{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(150px,1.5fr);column-gap:8px;align-items:center}
.srt.hd{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:6px;border-bottom:1px solid var(--border)}
.srt.hd div:nth-child(2),.srt.hd div:nth-child(3){text-align:center}
.srt.rw{padding:6px 0;border-bottom:1px solid var(--line)}
.srt.rw:last-child{border-bottom:0}
.srt .pn{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.srt .md{text-align:center;font-weight:700}
.rng{display:flex;flex-direction:column;gap:3px;min-width:0}
.rng .nums{font-size:11.5px;line-height:1.2;font-weight:600;text-align:center}
.rng .tr{position:relative;height:6px;border-radius:99px;background:var(--line)}
.rng .tr i{position:absolute;top:0;bottom:0;border-radius:99px}
.rng .tr b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);border-radius:1px;transform:translateX(-1px)}
.rng .tr u{position:absolute;top:-6px;bottom:-6px;width:0;border-left:1.5px dashed var(--muted);opacity:.7}
.mj{margin:18px auto 0;max-width:340px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:center}
.mj .pc{font-size:40px;font-weight:800;line-height:1}.mj .pc small{font-size:20px;color:var(--muted);font-weight:600;margin-left:2px}
.mj .lb{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.mj .bar{height:6px;border-radius:99px;background:var(--line);margin:12px 0 0;overflow:hidden}
.mj .bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.mj .st{display:flex;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.mj .st div{flex:1}.mj .st div+div{border-left:1px solid var(--line)}
.mj .st b{display:block;font-size:17px}.mj .st span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hlines{height:38px;text-align:center;font-size:12.5px;font-weight:600;margin:14px 0 4px;line-height:1.5}
.hlines div+div{color:var(--muted);font-weight:500}
.hist{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
.dim{opacity:.45;transition:opacity .2s}
.src{font-size:11px;color:var(--muted);text-align:center;line-height:1.5;margin:6px 4px 0}

@media (max-width:480px){
  .card{padding:14px 8px}
  .rt{font-size:11.5px}.rt th{font-size:9.5px;padding:4px 1px}.rt td{padding:9px 1px}.rt th:last-child{white-space:nowrap}
  .rt td.s{font-size:12.5px}
}
.tiles .sub2{display:block;font-size:10px;font-weight:500;color:var(--muted);line-height:1.25;margin-top:3px}
@media (min-width:600px){.tiles .sub2{font-size:11.5px}}

.rt thead th{vertical-align:bottom;padding-bottom:8px;border-bottom:1px solid var(--border);font-weight:600}
.rt th .sh{display:none}
@media (max-width:480px){.rt th .lg{display:none}.rt th .sh{display:inline}}
.chip[aria-pressed=true] .dot{box-shadow:0 0 0 1.5px currentColor}
.chip .dot{width:9px;height:9px}
.rt th:last-child{white-space:nowrap;min-width:30px}
@media (max-width:480px){.mapwrap{margin:0 -8px}}

</style>
</head>
